/* ── SpearLine Vis · "Deep water" ───────────────────────────────────────────────
 * Default look is deep water (no attribute needed, so the first paint is already dark).
 * data-theme="light" forces light; data-theme="auto" follows the phone.
 * The forecast tiers are water colours: murky olive (plankton-green water) → kelp → teal → blue → gin-clear.
 */
:root {
  color-scheme: dark;
  --bg: #04121f; --bg-deep: #020810;
  --surface: rgba(140, 200, 255, .055); --surface-2: rgba(140, 200, 255, .09); --solid: #0a1b2b;
  --ink: #e6f0f7; --ink-2: #b4c6d6; --muted: #7f95a8; --line: rgba(160, 205, 245, .12); --line-2: rgba(160, 205, 245, .22);
  --brand: #6fd8ff; --brand-ink: #03121e; --accent: #6fd8ff; --glow: rgba(111, 216, 255, .38);
  --chart-line: #6fd8ff; --chart-band: rgba(111,216,255,.16); --chart-win: rgba(111,216,255,.07);
  --good: #7fe3a8; --bad: #ff8a7a; --neutral: #7f95a8;
  --t0: #55613a; --t1: #3f7356; --t2: #2b8a8f; --t3: #2f8fd6; --t4: #8fe6ff;
  --t0-ink: #f1f4e6; --t1-ink: #ecf7f0; --t2-ink: #effcfc; --t3-ink: #f2f8ff; --t4-ink: #03243a;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0, 5, 12, .45);
  --radius: 18px; --radius-sm: 12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --num: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --page: radial-gradient(120% 70% at 50% -10%, #0e3350 0%, rgba(14,51,80,0) 60%), linear-gradient(180deg, #06182a 0%, #04121f 40%, #020810 100%);
  --map-water: #0b2338;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eaf2f7; --bg-deep: #dce9f2;
  --surface: rgba(255,255,255,.78); --surface-2: rgba(255,255,255,.95); --solid: #ffffff;
  --ink: #06243a; --ink-2: #345268; --muted: #5d778b; --line: rgba(6,36,58,.10); --line-2: rgba(6,36,58,.18);
  --brand: #0a6fa8; --brand-ink: #ffffff; --accent: #0a6fa8; --glow: rgba(10,111,168,0);
  --chart-line: #0a6fa8; --chart-band: rgba(10,111,168,.14); --chart-win: rgba(10,111,168,.06);
  --good: #0f7a3d; --bad: #b3261e; --neutral: #5d778b;
  --t0: #7d8650; --t1: #4f8a68; --t2: #2a9497; --t3: #1f7fc4; --t4: #0d4f86;
  --t0-ink: #ffffff; --t1-ink: #ffffff; --t2-ink: #ffffff; --t3-ink: #ffffff; --t4-ink: #ffffff;
  --shadow: 0 1px 2px rgba(6,36,58,.06), 0 8px 24px rgba(6,36,58,.08);
  --page: radial-gradient(120% 70% at 50% -10%, #ffffff 0%, rgba(255,255,255,0) 60%), linear-gradient(180deg, #eef5fa 0%, #e2edf5 100%);
  --map-water: #cfe3f0;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    color-scheme: light;
    --bg: #eaf2f7; --bg-deep: #dce9f2;
    --surface: rgba(255,255,255,.78); --surface-2: rgba(255,255,255,.95); --solid: #ffffff;
    --ink: #06243a; --ink-2: #345268; --muted: #5d778b; --line: rgba(6,36,58,.10); --line-2: rgba(6,36,58,.18);
    --brand: #0a6fa8; --brand-ink: #ffffff; --accent: #0a6fa8; --glow: rgba(10,111,168,0);
    --chart-line: #0a6fa8; --chart-band: rgba(10,111,168,.14); --chart-win: rgba(10,111,168,.06);
    --good: #0f7a3d; --bad: #b3261e; --neutral: #5d778b;
    --t0: #7d8650; --t1: #4f8a68; --t2: #2a9497; --t3: #1f7fc4; --t4: #0d4f86;
    --t0-ink: #ffffff; --t1-ink: #ffffff; --t2-ink: #ffffff; --t3-ink: #ffffff; --t4-ink: #ffffff;
    --shadow: 0 1px 2px rgba(6,36,58,.06), 0 8px 24px rgba(6,36,58,.08);
    --page: radial-gradient(120% 70% at 50% -10%, #ffffff 0%, rgba(255,255,255,0) 60%), linear-gradient(180deg, #eef5fa 0%, #e2edf5 100%);
    --map-water: #cfe3f0;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg-deep); }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
/* page gradient on a fixed layer (iOS ignores background-attachment: fixed) */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--page); pointer-events: none; }
body.noscroll { overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

/* ── Top bar ── */
header.top { position: sticky; top: 0; z-index: 5; padding-top: env(safe-area-inset-top);
  background: color-mix(in srgb, var(--bg) 78%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
  border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 8px; padding: 12px 0 6px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand svg { flex: none; }
.brand-text { min-width: 0; }
.brand h1 { margin: 0; font-size: 20px; letter-spacing: -.015em; font-weight: 760; white-space: nowrap; line-height: 1.1; }
.brand p { margin: 1px 0 0; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; font-size: 17px; flex: none; color: var(--ink-2); }
.iconbtn:active { transform: scale(.94); }
#status { font-size: 12.5px; color: var(--ink-2); min-height: 20px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--muted); flex: none; }
.dot.ok { background: #49d68b; box-shadow: 0 0 8px rgba(73,214,139,.6); } .dot.warn { background: #f5b83d; } .dot.err { background: #ff6b5b; }
.dot.live { background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot.live, .card.skeleton { animation: none; } }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: inherit; }
.link.danger { color: var(--bad); }

/* view switch: Forecast · Map · Dives */
.viewseg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; margin: 6px 0 2px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.viewseg button { border: 0; background: none; padding: 7px 0; border-radius: 9px; font-size: 13.5px; font-weight: 650; color: var(--ink-2); cursor: pointer; }
.viewseg button.on { background: var(--surface-2); color: var(--ink); box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 2px 8px rgba(0,0,0,.18); }

.tabs, .days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 0; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar, .days::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid var(--line); background: transparent; padding: 7px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dayrow { display: flex; align-items: center; gap: 8px; }
.days { flex: 1; min-width: 0; }
.day { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 5px 9px; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.15; min-width: 50px; }
.day b { font-size: 12.5px; }
.day span { font-size: 11px; color: var(--muted); }
.day.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 0 14px var(--glow); }
.sortbtn { flex: none; border: 0; background: none; color: var(--accent); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px 0; white-space: nowrap; }

/* ── Spot cards: glass with a water-clarity edge ── */
main { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
#list { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.island { margin: 14px 2px 0; font-size: 13px; color: var(--muted); font-weight: 650; letter-spacing: .01em; }
.card { position: relative; overflow: hidden; display: block; width: 100%; text-align: left; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 14px 11px 18px; box-shadow: var(--shadow); cursor: pointer;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--edge, var(--line-2)); box-shadow: 0 0 16px var(--edge, transparent); opacity: .95; }
.card.e0 { --edge: var(--t0); } .card.e1 { --edge: var(--t1); } .card.e2 { --edge: var(--t2); } .card.e3 { --edge: var(--t3); } .card.e4 { --edge: var(--t4); }
.card:active { transform: scale(.992); }
.card.skeleton { height: 118px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
@keyframes shimmer { to { background-position: -200% 0; } }
.card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.card-id { min-width: 0; }
.name { font-weight: 700; font-size: 16.5px; line-height: 1.25; letter-spacing: -.005em; }
.star { color: #ffc94a; margin-right: 4px; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.hero-mini { text-align: right; flex: none; }
.big { font-family: var(--num); font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px var(--glow); }
.big small { font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 2px; text-shadow: none; }
.lvl { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.strip { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; margin-top: 11px; }
.sc { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.sc i { font-style: normal; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.sc.sel i { color: var(--ink); font-weight: 700; }
.cell { display: block; width: 100%; text-align: center; border-radius: 8px; padding: 4px 0; font-family: var(--num); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.sc.best .cell { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }
.cell.t-1 { background: var(--surface-2); color: var(--muted); }
.cell.t0 { background: var(--t0); color: var(--t0-ink); } .cell.t1 { background: var(--t1); color: var(--t1-ink); }
.cell.t2 { background: var(--t2); color: var(--t2-ink); } .cell.t3 { background: var(--t3); color: var(--t3-ink); }
.cell.t4 { background: var(--t4); color: var(--t4-ink); box-shadow: 0 0 10px rgba(143,230,255,.35); }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--muted); margin: 16px 2px 0; }
.legend .cell { width: auto; padding: 2px 7px; font-size: 11px; }
.legend .bestkey { display: inline-block; width: 14px; height: 10px; border-radius: 3px; box-shadow: 0 0 0 1.5px var(--ink); margin-right: 2px; }

/* ── Map ── */
#mapView { padding-top: 10px; }
.map { position: relative; height: max(360px, calc(100vh - 290px)); border-radius: var(--radius); overflow: hidden; background: var(--map-water); border: 1px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: var(--shadow); }
.map .tiles, .map .charts, .map .pins, .map .spins, .map .struct { position: absolute; inset: 0; }
.map .struct { width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.map .struct .slc { fill: none; stroke: #8d99a6; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.map .struct .area { stroke-width: 1.5; stroke-dasharray: 4 3; }
.map .struct .area.seabed { fill: rgba(217,150,70,.28); stroke: #d99646; }
.map .struct .area.obstruction { fill: rgba(176,140,255,.22); stroke: #b08cff; }
.map .struct .area.wreck { fill: rgba(228,106,216,.22); stroke: #e46ad8; }
.map .struct .area.kelp { fill: rgba(63,191,106,.25); stroke: #3fbf6a; }
.map .struct .area.construction { fill: rgba(141,153,166,.55); stroke: #8d99a6; stroke-dasharray: none; }
.pin.st { width: 18px; height: 18px; border-radius: 50%; font: 700 10px/16px var(--num); color: #10161d; border: 1.5px solid rgba(10,16,22,.75); box-shadow: 0 1px 4px rgba(0,0,0,.45); text-align: center; }
.pin.st::after { content: ""; position: absolute; inset: -9px; }   /* 36 px touch target */
.pin.st.rock { background: #ff7a59; } .pin.st.rock.sub { background: #10161d; color: #ff7a59; border-color: #ff7a59; }
.pin.st.seabed { background: #d99646; border-radius: 4px; } .pin.st.kelp { background: #3fbf6a; }
.pin.st.wreck { background: #e46ad8; } .pin.st.obstruction { background: #b08cff; } .pin.st.reef { background: #ffd166; border-radius: 4px; }
.map .mpop { position: absolute; z-index: 3; width: 236px; transform: translate(-50%, calc(-100% - 14px)); background: var(--solid); color: var(--ink); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px; font-size: 12.5px; line-height: 1.4; }
.map .mpop h4 { margin: 0 22px 4px 0; font-size: 14px; } .map .mpop p { margin: 2px 0; color: var(--ink-2); } .map .mpop .src { font-size: 11px; color: var(--muted); margin-top: 6px; }
.map .mpop .x { position: absolute; right: 6px; top: 4px; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; width: 28px; height: 28px; }
.map .mpop .btn { margin-top: 8px; width: 100%; }
.maplegend .st { display: inline-block; width: 14px; height: 14px; border-radius: 50%; font: 700 8.5px/12px var(--num); text-align: center; color: #10161d; border: 1px solid rgba(10,16,22,.75); margin-right: 4px; vertical-align: -2px; }
.map .charts { opacity: .9; }
.map .tiles img, .map .charts img { position: absolute; width: 256px; height: 256px; max-width: none; user-select: none; -webkit-user-drag: none; pointer-events: none; }
/* night map: invert the light base map so land reads dark grey-blue and water deep blue */
:root:not([data-theme="light"]) .map .tiles, :root:not([data-theme="light"]) .map .charts { filter: invert(.9) hue-rotate(185deg) saturate(.8) brightness(.95) contrast(.9); }
@media (prefers-color-scheme: light) { :root[data-theme="auto"] .map .tiles, :root[data-theme="auto"] .map .charts { filter: none; } }
.pin { position: absolute; transform: translate(-50%, -50%); border: 0; padding: 0; cursor: pointer; }
.pin.spot { min-width: 30px; height: 22px; padding: 0 6px; border-radius: 11px; font-family: var(--num); font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums;
  border: 1.5px solid rgba(255,255,255,.75); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.pin.spot.t-1 { background: #3a4b5c; color: #e6f0f7; }
.pin.spot.t0 { background: var(--t0); color: var(--t0-ink); } .pin.spot.t1 { background: var(--t1); color: var(--t1-ink); } .pin.spot.t2 { background: var(--t2); color: var(--t2-ink); }
.pin.spot.t3 { background: var(--t3); color: var(--t3-ink); } .pin.spot.t4 { background: var(--t4); color: var(--t4-ink); }
.map.far .pin.spot { min-width: 0; width: 13px; height: 13px; padding: 0; font-size: 0; border-radius: 50%; border-width: 1.5px; }
.pin.dive { width: 18px; height: 18px; border-radius: 50% 50% 50% 0; transform: translate(-50%, -100%) rotate(-45deg); background: #ffc94a; border: 2px solid #3a2500; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
.pin.dive.caught { background: #ff8a5c; }
.map .ctrl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.map .ctrl button { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--solid) 85%, transparent); color: var(--ink); font-size: 20px; font-weight: 600; cursor: pointer; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.map .credit { position: absolute; left: 0; bottom: 0; max-width: 100%; padding: 3px 8px; font-size: 10.5px; color: var(--ink-2); background: color-mix(in srgb, var(--solid) 80%, transparent); border-top-right-radius: 8px; }
.map .credit a { color: var(--ink); }
.map .ctrl button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.map .cross { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); pointer-events: none; }
.map .cross::before, .map .cross::after { content: ""; position: absolute; background: var(--accent); box-shadow: 0 0 6px rgba(0,0,0,.6); }
.map .cross::before { left: 21px; top: 0; width: 2px; height: 44px; } .map .cross::after { top: 21px; left: 0; height: 2px; width: 44px; }
.mapbar { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; flex-wrap: wrap; }
.mapbar p { margin: 0; flex: 1; min-width: 150px; font-size: 13px; color: var(--ink-2); }
.maplegend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin: 10px 2px 0; align-items: center; }
.maplegend i { display: inline-block; width: 11px; height: 11px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #ffc94a; margin-right: 5px; vertical-align: -1px; }
.maplegend i.caught { background: #ff8a5c; }

/* ── Dives view ── */
#divesView { padding-top: 10px; }
.dhead-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.dhead-row select { flex: 1; min-width: 160px; }
select, input, textarea { font: inherit; font-size: 16px; font-weight: 400; padding: 10px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); }
.tally { display: grid; grid-template-columns: 1fr auto auto auto; gap: 4px 12px; font-size: 13.5px; align-items: baseline; }
.tally .h { color: var(--muted); font-size: 12px; }
.tally .n { font-family: var(--num); font-variant-numeric: tabular-nums; text-align: right; }
.divecard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 12px; margin: 8px 0; cursor: pointer; display: block; width: 100%; text-align: left; color: var(--ink); }
.divecard .when { color: var(--muted); font-size: 12.5px; }
.divecard .what { font-size: 13.5px; margin-top: 3px; color: var(--ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.tag.caught { border-color: rgba(255,138,92,.6); color: var(--ink); }
.tag.protected { border-color: rgba(255,201,74,.6); }

/* ── Detail overlay ── */
#detail { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
#detail::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--page); pointer-events: none; }
#detail[hidden], #sheet[hidden] { display: none; }
.dhead { position: sticky; top: 0; z-index: 2; padding-top: env(safe-area-inset-top); border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.dhead .wrap { display: flex; align-items: center; gap: 10px; padding-top: 10px; padding-bottom: 10px; }
.dhead h2 { flex: 1; margin: 0; font-size: 18px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { color: var(--muted); font-size: 13px; margin: 12px 0 4px; }
.days.in-detail .day { min-width: 46px; padding: 5px 6px; gap: 3px; }
.days.in-detail .cell.mini { font-size: 12px; padding: 2px 5px; }
.hero { display: flex; align-items: center; gap: 16px; margin: 10px 0 2px; flex-wrap: wrap; }
.hero-num { font-family: var(--num); font-size: 68px; font-weight: 700; letter-spacing: -.04em; line-height: .95; font-variant-numeric: tabular-nums; text-shadow: 0 0 34px var(--glow); }
.hero-num span { font-family: var(--font); font-size: 20px; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; text-shadow: none; }
.hero-rating { font-size: 21px; font-weight: 700; }
.hero-conf { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.hero-when { font-size: 12.5px; color: var(--muted); }
.hero-sub { color: var(--ink-2); font-size: 13.5px; margin-bottom: 6px; }
.conf { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--accent); display: inline-block; }
.conf.high { background: var(--accent); }
.conf.medium { background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px; margin: 12px 0; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.panel h2 { margin: 0 0 8px; font-size: 15px; }
.panel h2 small { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 4px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--line-2); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--num); font-variant-numeric: tabular-nums; }
.chart .winlbl { font-size: 9px; }
.chart .win { fill: var(--chart-win); }
.chart .band { fill: var(--chart-band); }
.chart .ln { fill: none; stroke: var(--chart-line); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 4px var(--glow)); }
.chart .xh { stroke: var(--ink-2); stroke-width: 1; }
.chart .xd { fill: var(--chart-line); stroke: var(--bg); stroke-width: 2; }
.chart .hit { fill: transparent; cursor: crosshair; }
.tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 8px; border-radius: 8px; white-space: nowrap; pointer-events: none; }
.tip b { font-family: var(--num); font-size: 13px; }
.zones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.zones > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.zones .zhead { border-color: var(--accent); box-shadow: 0 0 14px var(--glow) inset; }
.zl { font-size: 12px; font-weight: 700; }
.zv { font-family: var(--num); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.zv small { font-family: var(--font); font-size: 12px; color: var(--muted); margin-left: 2px; }
.zs { font-size: 11px; color: var(--muted); }
.chips { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 560px) { .chips { grid-template-columns: 1fr 1fr; } }
.chip { display: flex; gap: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 10px; background: var(--surface-2); }
.chip-ic { font-size: 18px; line-height: 1.2; }
.chip-body { min-width: 0; }
.chip-t { font-weight: 700; font-size: 13.5px; }
.chip-v { font-size: 13px; color: var(--ink-2); }
.chip-n { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.imp { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; }
.imp.good { color: var(--good); } .imp.bad { color: var(--bad); } .imp.neutral { color: var(--neutral); }
table.cond { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.cond th, table.cond td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.cond thead th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.cond tbody tr:last-child th, table.cond tbody tr:last-child td { border-bottom: 0; }
.tide-body { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13.5px; }
.actions { display: flex; gap: 8px; margin: 14px 0; }
.actions.flexwrap { flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); border-radius: 12px; padding: 10px 15px; font-weight: 650; cursor: pointer; font-size: 14px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); box-shadow: 0 0 18px var(--glow); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.filebtn { display: inline-flex; align-items: center; }
.prov { color: var(--muted); font-size: 11.5px; margin: 8px 0 40px; }

/* ── Bottom sheet ── */
#sheet { position: fixed; inset: 0; z-index: 30; background: rgba(1,6,12,.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet-card { background: var(--solid); color: var(--ink); width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); position: relative; border: 1px solid var(--line); border-bottom: 0; }
.sheet-card h2 { margin: 0 34px 8px 0; font-size: 18px; }
.sheet-card h3 { font-size: 14px; margin: 18px 0 6px; }
.sheet-close { position: absolute; top: 10px; right: 10px; }
.sheet-card label { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600; margin: 10px 0; }
.sheet-card input, .sheet-card select, .sheet-card textarea { width: 100%; }
.sheet-card .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet-card .row2 label { margin: 6px 0; }
.sheet-card label.check { flex-direction: row; align-items: center; gap: 10px; }
.sheet-card label.check input { width: 22px; height: 22px; margin: 0; padding: 0; accent-color: var(--brand); }

.seg button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

.warnline { font-size: 12.5px; color: #ffc94a; margin: 2px 0 0; }

.credits { padding-left: 18px; font-size: 13px; color: var(--ink-2); } .credits li { margin: 6px 0; }
.prov a, .credits a, .sheet-card p a { color: var(--accent); }

button, .card, .tab, .day, .btn, .iconbtn, label.btn, a { -webkit-tap-highlight-color: transparent; }
button, .card, .tab, .day, .btn, .iconbtn, label.btn { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.sheet-card small { font-weight: 400; }
.sheet-card p { font-size: 14px; }
.how { padding-left: 18px; font-size: 14px; } .how li { margin: 6px 0; }
.logs { list-style: none; padding: 0; margin: 0; font-size: 13.5px; }
.logs li { border-bottom: 1px solid var(--line); padding: 8px 0; display: grid; gap: 2px; justify-items: start; }
.error { color: var(--bad); font-weight: 600; }
footer.foot { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 16px 36px; }
footer.foot button { font-size: 12px; }
@media (forced-colors: active) { .cell, .pin.spot { border: 1px solid CanvasText; } }

<script>
/* SpearLine Vis — visibility model (pure functions, no I/O).
 *
 * Physics chain (see the About sheet in the app for sources):
 *   horizontal visibility  y = 4.8 / c                     (Zaneveld & Pegau 2003; Davies-Colley 1988)
 *   beam attenuation       c = c_water + c_background + c_plankton + c_resuspension + c_wind + c_runoff
 *   c_water    ≈ 0.047 1/m at 532 nm                        (Pope & Fry 1997 absorption + seawater scattering)
 *   c_plankton = 0.31 · Chl^0.62                            (Gordon & Morel 1983 b_p(550)=0.30·Chl^0.62, scaled to 532 nm)
 *   c_resusp   ∝ S · max(0, (u_b/u_cr)² − 1)                (excess bed shear stress; u_b from linear wave theory)
 *   c_runoff   ∝ R · (rain index)^0.8, 72 h e-folding       (LA County 72 h rain advisory; Nezlin & DiGiacomo 2005)
 *   diver visibility = K · black-target visibility          (divers judge lower-contrast targets than a black disk)
 */
(function (root) {
  'use strict';

  const P = {
    K: 0.6,                // diver factor: fraction of black-target visibility a diver reports
    cWater: 0.047,         // 1/m, pure seawater beam attenuation at ~532 nm
    chlRef: 0.25,          // mg/m3, chlorophyll at which a spot's clean-and-calm baseline (vref) is defined
    phytoA: 0.31, phytoB: 0.62,
    g: 9.81,
    uCrit: 0.20,           // m/s, near-bed orbital velocity where fine sand starts moving (Soulsby threshold, T≈10–14 s)
    kResusp: 0.12,         // 1/m per unit excess stress per unit sediment availability
    cResuspMax: 4.0,
    tauUpH: 2, tauDownH: 12,    // resuspended fines: fast to stir up, slow to settle
    windCalmKt: 6,         // below this effective onshore wind, no chop penalty
    kWind: 0.025,          // 1/m per knot above windCalmKt
    windTauUpH: 1, windTauDownH: 3,
    rainThreshMm: 2.54,    // 0.1 in — LA County "significant rainfall" threshold
    rainTauH: 72,          // runoff index e-folding time (72 h advisory)
    kRunoff: 2.0,          // 1/m at 1 inch of effective rain index and R = 1
    localOpenKm: 12,       // land farther than this is left to the regional wave model (~9 km grid)
    spreadDeg: 15,         // directional spreading used to smooth the exposure window
    exposureFloor: 0.08,   // diffraction / refraction wrap-around into fully blocked directions
    chlTauDays: 10,        // forecast chlorophyll relaxes toward the recent median with this e-folding
  };

  const FT = 3.28084;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const d2r = Math.PI / 180;

  // ── Fetch profile (72 bearings) ────────────────────────────────────────────────
  function decodeFetchKm(ch) {
    if (ch === 'Z') return 999;
    const i = ch.charCodeAt(0) - 97;           // 'a' = 0
    return 0.1 * Math.pow(2, i / 2);
  }
  function decodeProfile(str) { return Array.from(str, decodeFetchKm); }

  // Local openness of one bearing: 0 when land is within 1 km, 1 when the nearest land is ≥ localOpenKm away.
  function openness(fetchKm) {
    if (fetchKm >= P.localOpenKm) return 1;
    if (fetchKm <= 1) return 0;
    return Math.log(fetchKm) / Math.log(P.localOpenKm);
  }

  // Precompute a 360-entry exposure table (index = direction waves come FROM, degrees).
  function exposureTable(profileKm) {
    const open = profileKm.map(openness);
    const n = open.length, step = 360 / n;
    const table = new Float32Array(360);
    const s = P.spreadDeg;
    for (let dir = 0; dir < 360; dir++) {
      let num = 0, den = 0;
      for (let k = -3 * s; k <= 3 * s; k += step) {
        const w = Math.exp(-0.5 * (k / s) * (k / s));
        const b = ((dir + k) % 360 + 360) % 360;
        const i = Math.round(b / step) % n;
        num += w * open[i]; den += w;
      }
      const e = num / den;
      table[dir] = P.exposureFloor + (1 - P.exposureFloor) * e;
    }
    return table;
  }
  const expAt = (table, dirFrom) => (dirFrom == null || isNaN(dirFrom)) ? 0.5 : table[((Math.round(dirFrom) % 360) + 360) % 360];

  // ── Linear wave theory ─────────────────────────────────────────────────────────
  // Wavenumber from ω² = g k tanh(kh): Fenton & McKee (1990) explicit start + 2 Newton steps.
  function waveNumber(T, h) {
    const w = 2 * Math.PI / T;
    const k0h = w * w * h / P.g;
    let kh = k0h / Math.pow(Math.tanh(Math.pow(k0h, 0.75)), 2 / 3);
    for (let i = 0; i < 2; i++) {
      const t = Math.tanh(kh);
      const f = kh * t - k0h;
      const df = t + kh * (1 - t * t);
      kh -= f / df;
    }
    return kh / h;
  }
  // Near-bed orbital velocity amplitude (m/s) for significant height H (m), period T (s), depth h (m).
  function bottomVelocity(H, T, h) {
    if (!(H > 0) || !(T > 0) || !(h > 0)) return 0;
    const kh = waveNumber(T, h) * h;
    if (kh > 10) return 0;
    return Math.PI * H / (T * Math.sinh(kh));
  }

  // ── Attenuation components ─────────────────────────────────────────────────────
  const cPlankton = chl => P.phytoA * Math.pow(Math.max(0.01, chl), P.phytoB);
  function cBackground(vrefFt) {
    const vrefM = vrefFt / FT;
    return Math.max(0, P.K * 4.8 / vrefM - P.cWater - cPlankton(P.chlRef));
  }
  const excessStress = u => Math.max(0, (u / P.uCrit) * (u / P.uCrit) - 1);
  const cResuspInst = (u, S) => Math.min(P.cResuspMax, P.kResusp * S * excessStress(u));
  function onshoreWeight(windFromDeg, facingDeg) {
    const d = (windFromDeg - facingDeg) * d2r;           // wind blowing FROM the sea toward shore → cos = 1
    return 0.35 + 0.65 * Math.max(0, Math.cos(d));
  }
  const cWindInst = (kt, weight) => P.kWind * Math.max(0, kt * weight - P.windCalmKt);
  function cRunoff(rainIndexMm, R) {
    const x = Math.max(0, rainIndexMm - P.rainThreshMm) / 25.4;
    return x > 0 ? P.kRunoff * R * Math.pow(x, 0.8) : 0;
  }
  const visFromC = c => P.K * 4.8 / c * FT;             // feet

  // First-order lag with different time constants for rising/falling input (hourly series).
  function lag(series, tauUp, tauDown) {
    const out = new Array(series.length);
    let y = series.length ? series[0] : 0;
    for (let i = 0; i < series.length; i++) {
      const x = series[i];
      const tau = x > y ? tauUp : tauDown;
      y = y + (x - y) * (1 - Math.exp(-1 / tau));
      out[i] = y;
    }
    return out;
  }

  // Runoff index: exponentially-decaying sum of hourly rain (mm).
  function rainIndex(rainMm) {
    const a = Math.exp(-1 / P.rainTauH);
    const out = new Array(rainMm.length);
    let s = 0;
    for (let i = 0; i < rainMm.length; i++) { s = s * a + (rainMm[i] || 0); out[i] = s; }
    return out;
  }

  // ── Chlorophyll: nowcast and forecast ──────────────────────────────────────────
  // obs: [{day: 'YYYY-MM-DD', chl, n}] per spot (already merged across sensors), newest last.
  function chlNowcast(obs, todayStr) {
    const valid = obs.filter(o => o.chl > 0);
    if (!valid.length) return null;
    const dayNum = s => Date.parse(s + 'T00:00:00Z') / 86400000;
    const t0 = dayNum(todayStr);
    const newest = valid[valid.length - 1];
    const age = Math.max(0, Math.round(t0 - dayNum(newest.day)));
    let num = 0, den = 0;
    for (const o of valid.slice(-5)) {
      const a = Math.max(0, t0 - dayNum(o.day));
      const w = Math.exp(-a / 1.5) * Math.sqrt(o.n || 1);
      num += w * Math.log(o.chl); den += w;
    }
    const logs = valid.map(o => Math.log(o.chl)).sort((a, b) => a - b);
    const med = Math.exp(logs[Math.floor(logs.length / 2)]);
    return { chl: Math.exp(num / den), age, clim: med, newestDay: newest.day, nDays: valid.length };
  }
  function chlForDay(now, daysAhead) {
    if (!now) return null;
    const f = Math.exp(-(now.age + Math.max(0, daysAhead)) / P.chlTauDays);
    const f0 = Math.exp(-now.age / P.chlTauDays);
    // anchor the nowcast at lead 0, then relax toward the recent median
    const ln = Math.log(now.clim) + (Math.log(now.chl) - Math.log(now.clim)) * (f / f0);
    return Math.exp(ln);
  }

  // ── Main hourly run for one spot ───────────────────────────────────────────────
  /* input = {
   *   spot, expTable,
   *   times: [ISO local hour strings], tIndexNow,
   *   waves: {swellH, swellT, swellDir, swell2H, swell2T, swell2Dir, windWaveH, windWaveT, windWaveDir} (arrays, m/s/deg),
   *   wind:  {kt:[], dir:[]}, rainMm: [] (aligned to times),
   *   chlByDay: {'YYYY-MM-DD': chl}, calib: multiplier
   * } */
  function runSpot(input) {
    const { spot, expTable, times, waves, wind, rainMm, chlByDay } = input;
    const n = times.length;
    const calib = input.calib || 1;
    const hPost = spot.depth / FT;
    const shore = spot.access === 'shore';
    const cBg = cBackground(spot.vref);

    const uPost = new Array(n), uBreak = new Array(n), uOpen = new Array(n), hSite = new Array(n), ex1 = new Array(n);
    for (let i = 0; i < n; i++) {
      const comps = [
        [waves.swellH[i], waves.swellT[i], waves.swellDir[i]],
        [waves.swell2H ? waves.swell2H[i] : 0, waves.swell2T ? waves.swell2T[i] : 0, waves.swell2Dir ? waves.swell2Dir[i] : null],
        [waves.windWaveH[i], waves.windWaveT[i], waves.windWaveDir[i]],
      ];
      let sP = 0, sB = 0, sO = 0, e2 = 0;
      comps.forEach(([H, T, D], j) => {
        if (!(H > 0) || !(T > 0)) return;
        const e = expAt(expTable, D);
        const Hs = H * e;
        if (j === 0) ex1[i] = e;
        e2 += Hs * Hs;
        const uP = bottomVelocity(Hs, T, hPost);
        sP += uP * uP;
        sB += Math.pow(bottomVelocity(Math.min(Hs, 0.78 * 1.8), T, 1.8), 2);   // break zone ~6 ft deep, depth-limited
        sO += Math.pow(bottomVelocity(Hs, T, hPost * 1.8), 2);
      });
      uPost[i] = Math.sqrt(sP); uBreak[i] = Math.sqrt(sB); uOpen[i] = Math.sqrt(sO); hSite[i] = Math.sqrt(e2);
      if (ex1[i] === undefined) ex1[i] = null;
    }

    const rsPost = lag(uPost.map(u => cResuspInst(u, spot.S)), P.tauUpH, P.tauDownH);
    const rsBreak = lag(uBreak.map(u => cResuspInst(u, Math.min(1, spot.S + 0.3))), P.tauUpH, P.tauDownH);
    const rsOpen = lag(uOpen.map(u => cResuspInst(u, spot.S * 0.5)), P.tauUpH, P.tauDownH);
    const wWeight = wind.dir.map(d => (d == null ? 0.6 : onshoreWeight(d, spot.facing)));
    const cWind = lag(wind.kt.map((k, i) => cWindInst(k || 0, wWeight[i])), P.windTauUpH, P.windTauDownH);
    const rIdx = input.rainIdx || rainIndex(rainMm);

    const out = { vis: new Array(n), visBreak: new Array(n), visOpen: new Array(n), parts: new Array(n) };
    for (let i = 0; i < n; i++) {
      const day = times[i].slice(0, 10);
      const chl = chlByDay[day];
      const cPh = chl != null ? cPlankton(chl) : cPlankton(P.chlRef * 1.6);
      const cRo = cRunoff(rIdx[i], spot.R);
      const c = P.cWater + cBg + cPh + rsPost[i] + cWind[i] + cRo;
      out.vis[i] = visFromC(c) * calib;
      if (shore) {
        const cB = P.cWater + cBg * 1.3 + cPh + rsBreak[i] + cWind[i] * 1.3 + cRo * 1.2;
        const cO = P.cWater + cBg * 0.6 + cPh + rsOpen[i] + cWind[i] * 0.7 + cRo * 0.7;
        out.visBreak[i] = visFromC(cB) * calib;
        out.visOpen[i] = visFromC(cO) * calib;
      }
      out.parts[i] = { c, cBg, cPh, cRs: rsPost[i], cWind: cWind[i], cRo, chl, u: uPost[i], hSite: hSite[i], exposure: ex1[i], windWeight: wWeight[i], rainIdx: rIdx[i] };
    }

  }

  function termImpactFt(parts, key, calib) {
    const c = parts.c;
    const without = c - parts[key];
    return (visFromC(without) - visFromC(c)) * (calib || 1);
  }

  function planktonImpactFt(parts, calib) {
    const cRef = cPlankton(P.chlRef);
    const cAlt = parts.c - parts.cPh + cRef;
    return (visFromC(parts.c) - visFromC(cAlt)) * (calib || 1);
  }

  // ── Confidence ─────────────────────────────────────────────────────────────────
  function confidence({ chlAge, leadDays, hSiteFt, rainIdxMm, nLogs }) {
    let score = 0;
    if (chlAge == null) score -= 3; else if (chlAge >= 5) score -= 3; else if (chlAge >= 3) score -= 2; else if (chlAge >= 2) score -= 1;
    if (leadDays >= 4) score -= 3; else if (leadDays >= 2) score -= 2; else if (leadDays >= 1) score -= 1;
    if (hSiteFt > 5) score -= 1;
    if (rainIdxMm > 6) score -= 1;
    if (nLogs >= 3) score += 1;
    const level = score >= -1 ? 'High' : score >= -3 ? 'Medium' : 'Low';
    const half = level === 'High' ? 0.10 : level === 'Medium' ? 0.18 : 0.30;
    return { level, half, score };
  }

  // ── Calibration from dive logs ─────────────────────────────────────────────────
  // logs: [{spotId, group, obsFt, predFt, t(ms)}]. Returns multiplier for a spot.
  function calibration(logs, spotId, group, nowMs) {
    const halfLifeDays = 60;
    const stat = arr => {
      let num = 0, den = 0;
      for (const l of arr) {
        if (!(l.obsFt > 0) || !(l.predFt > 0)) continue;
        const ageD = Math.max(0, (nowMs - l.t) / 86400000);
        const w = Math.pow(0.5, ageD / halfLifeDays);
        num += w * Math.log(l.obsFt / l.predFt); den += w;
      }
      return { mean: den ? num / den : 0, n: den };
    };
    const s = stat(logs.filter(l => l.spotId === spotId));
    const g = stat(logs.filter(l => l.group === group && l.spotId !== spotId));
    const wS = s.n / (s.n + 2), wG = g.n / (g.n + 4);
    const b = wS * s.mean + (1 - wS) * wG * g.mean;
    return { mult: Math.exp(clamp(b, -1.2, 1.2)), nSpot: logs.filter(l => l.spotId === spotId).length, nGroup: logs.filter(l => l.group === group).length };
  }

  const TIERS = ['Poor', 'Fair', 'Good', 'Great', 'Epic'];
  function tier(ft) { return ft < 5 ? 0 : ft < 10 ? 1 : ft < 15 ? 2 : ft < 25 ? 3 : 4; }
  const rating = ft => TIERS[tier(ft)];

  const API = { P, FT, decodeFetchKm, decodeProfile, openness, exposureTable, expAt, waveNumber, bottomVelocity,
    cPlankton, cBackground, excessStress, cResuspInst, onshoreWeight, cWindInst, cRunoff, visFromC, lag, rainIndex,
    chlNowcast, chlForDay, runSpot, termImpactFt, planktonImpactFt, confidence, calibration, rating, tier, TIERS };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  root.VisModel = API;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* SpearLine Vis — data layer: Open-Meteo (waves, wind, rain), NASA GIBS (satellite chlorophyll),
 * NOAA CO-OPS (tides). All endpoints are keyless and CORS-enabled, so this runs entirely in the browser. */
(function (root) {
  'use strict';

  const TZ = 'America/Los_Angeles';
  const LS = 'spearline:';
  const GIBS_WMS = 'https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi';
  const GIBS_CMAP = 'https://gibs.earthdata.nasa.gov/colormaps/v1.3/VIIRS_Chlorophyll.xml'; // same 0.01–20 mg/m3 log map as MODIS/OLCI/PACE layers
  const CHL_BBOX = [33.25, -120.55, 34.45, -118.10];   // lat_min, lon_min, lat_max, lon_max (EPSG:4326, WMS 1.3.0 axis order)
  const CHL_RES = 0.0087890625;                        // native pixel size of the GIBS "1km" tile matrix
  // [layer id, weight, days of history to pull]
  const CHL_LAYERS = [
    ['VIIRS_NOAA20_Chlorophyll_a', 1.0, 14],
    ['VIIRS_NOAA21_Chlorophyll_a', 1.0, 14],
    ['S3A_OLCI_Chlorophyll_a', 0.8, 4],
    ['S3B_OLCI_Chlorophyll_a', 0.8, 4],
    ['OCI_PACE_Chlorophyll_a', 0.8, 4],
    ['MODIS_Aqua_L2_Chlorophyll_A', 0.6, 4],
  ];
  const SENSOR_LABEL = { VIIRS_NOAA20_Chlorophyll_a: 'VIIRS NOAA-20', VIIRS_NOAA21_Chlorophyll_a: 'VIIRS NOAA-21', S3A_OLCI_Chlorophyll_a: 'OLCI S3A', S3B_OLCI_Chlorophyll_a: 'OLCI S3B', OCI_PACE_Chlorophyll_a: 'PACE OCI', MODIS_Aqua_L2_Chlorophyll_A: 'MODIS Aqua' };

  // ── small utils ────────────────────────────────────────────────────────────────
  // iOS build only: durable user data (dive log, tuning, saved spots, settings) goes through the native
  // bridge (UserDefaults via Capacitor Preferences), because iOS may clear web-view localStorage when the
  // device is low on space. Caches stay in localStorage. In a browser (no bridge) nothing changes.
  const NATIVE = !!(root.SLNative && root.SLNative.isNative);
  const DURABLE = new Set(['logs', 'overrides', 'favs', 'theme', 'group', 'sort', 'alerts']);
  const viaNative = k => NATIVE && DURABLE.has(k);
  const lsGet = (k, fallback) => {
    if (viaNative(k)) { try { const v = root.SLNative.prefs.get(k); return v == null ? fallback : v; } catch (e) { return fallback; } }
    try { const v = localStorage.getItem(LS + k); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  };
  const lsSet = (k, v) => {
    if (viaNative(k)) { try { return root.SLNative.prefs.set(k, v) !== false; } catch (e) { return false; } }
    try { localStorage.setItem(LS + k, JSON.stringify(v)); return true; } catch (e) { return false; }
  };
  const lsDel = k => {
    if (viaNative(k)) { try { root.SLNative.prefs.del(k); } catch (e) { /* ignore */ } return; }
    try { localStorage.removeItem(LS + k); } catch (e) { /* ignore */ }
  };

  function localParts(date) {
    const f = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' });
    const p = Object.fromEntries(f.formatToParts(date).map(x => [x.type, x.value]));
    return { day: `${p.year}-${p.month}-${p.day}`, hour: +p.hour };
  }
  const todayLocal = () => localParts(new Date()).day;
  const nowHourKey = () => { const p = localParts(new Date()); return `${p.day}T${String(p.hour).padStart(2, '0')}:00`; };
  function addDays(dayStr, n) { const d = new Date(dayStr + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

  async function fetchWithTimeout(url, ms = 20000, init) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms);
    try { return await fetch(url, Object.assign({ signal: ctl.signal }, init || {})); }
    finally { clearTimeout(t); }
  }
  // Busy or briefly unreachable services (HTTP 429/5xx, network errors, timeouts) are retried twice,
  // after 1.5 s and 4 s. Other errors fail at once.
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function fetchJSON(url, ms, tries = 3) {
    const host = new URL(url).host;
    let lastErr = null;
    for (let a = 0; a < tries; a++) {
      if (a) await sleep(a === 1 ? 1500 : 4000);
      try {
        const r = await fetchWithTimeout(url, ms);
        if (r.status === 429 || r.status >= 500) { lastErr = new Error(`${host} is busy (HTTP ${r.status})`); continue; }
        if (!r.ok) throw Object.assign(new Error(`HTTP ${r.status} from ${host}`), { final: true });
        const j = await r.json();
        if (j && j.error) throw Object.assign(new Error(j.reason || 'API error'), { final: true });
        return j;
      } catch (e) {
        if (e.final) throw e;
        lastErr = e && e.name === 'AbortError' ? new Error(`${host} did not answer in time`) : e;
      }
    }
    throw lastErr;
  }
  async function pool(items, n, fn) {
    const out = new Array(items.length); let next = 0;
    async function worker() { while (next < items.length) { const i = next++; try { out[i] = await fn(items[i], i); } catch (e) { out[i] = { error: e }; } } }
    await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
    return out;
  }

  // ── Open-Meteo ─────────────────────────────────────────────────────────────────
  // Dedupe spots that fall in the same model cell so the multi-location request stays small.
  function groupPoints(spots, cellsPerDeg) {
    const keyOf = s => `${Math.floor(s.o[0] * cellsPerDeg)}:${Math.floor(s.o[1] * cellsPerDeg)}`;
    const groups = new Map();
    for (const s of spots) { const k = keyOf(s); if (!groups.has(k)) groups.set(k, { lat: s.o[0], lon: s.o[1], ids: [] }); groups.get(k).ids.push(s.id); }
    return [...groups.values()];
  }

  const MARINE_VARS = ['wave_height', 'swell_wave_height', 'swell_wave_period', 'swell_wave_peak_period', 'swell_wave_direction',
    'secondary_swell_wave_height', 'secondary_swell_wave_period', 'secondary_swell_wave_direction',
    'wind_wave_height', 'wind_wave_period', 'wind_wave_peak_period', 'wind_wave_direction'];

  // Compact per-point storage: {times, points:[{grid, h:{var:[...]}}], map:{spotId: pointIndex}}
  const round = (arr, dp) => arr.map(v => (v == null ? null : +v.toFixed(dp)));

  async function getMarine(spots, attempt = 0) {
    const pts = groupPoints(spots, 12);          // MFWAM grid is 1/12°
    const url = 'https://marine-api.open-meteo.com/v1/marine?' + new URLSearchParams({
      latitude: pts.map(p => p.lat.toFixed(4)).join(','), longitude: pts.map(p => p.lon.toFixed(4)).join(','),
      hourly: MARINE_VARS.join(','), past_days: '2', forecast_days: '8', timezone: TZ, cell_selection: 'sea',
    });
    let res = await fetchJSON(url, 30000);
    res = Array.isArray(res) ? res : [res];
    const out = { times: null, points: [], map: {} };
    const needRetry = [];
    res.forEach((r, i) => {
      const hasData = r.hourly && r.hourly.swell_wave_height && r.hourly.swell_wave_height.some(v => v != null);
      if (!hasData) { needRetry.push(...pts[i].ids); return; }
      if (!out.times) out.times = r.hourly.time;
      const h = {};
      for (const v of MARINE_VARS) if (r.hourly[v]) h[v] = round(r.hourly[v], /direction/.test(v) ? 0 : 2);
      out.points.push({ grid: [+r.latitude.toFixed(3), +r.longitude.toFixed(3)], h });
      for (const id of pts[i].ids) out.map[id] = out.points.length - 1;
    });
    if (needRetry.length && attempt === 0) {   // model cell masked as land: step 6 km offshore along the spot's facing and retry once
      const retry = spots.filter(s => needRetry.includes(s.id)).map(s => {
        const th = s.facing * Math.PI / 180, cosl = Math.cos(s.o[0] * Math.PI / 180);
        return Object.assign({}, s, { o: [s.o[0] + 6 * Math.cos(th) / 110.57, s.o[1] + 6 * Math.sin(th) / (111.32 * cosl)] });
      });
      try {
        const more = await getMarine(retry, 1);
        if (!out.times) out.times = more.times;
        const base = out.points.length;
        out.points.push(...more.points);
        for (const [id, i] of Object.entries(more.map)) out.map[id] = base + i;
      } catch (e) { /* leave missing */ }
    }
    if (!out.times) throw new Error('no wave data returned');
    return out;
  }

  async function getWeather(spots) {
    const pts = groupPoints(spots, 30);          // ~3–4 km cells
    const url = 'https://api.open-meteo.com/v1/forecast?' + new URLSearchParams({
      latitude: pts.map(p => p.lat.toFixed(4)).join(','), longitude: pts.map(p => p.lon.toFixed(4)).join(','),
      hourly: 'wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation', wind_speed_unit: 'kn', precipitation_unit: 'mm',
      past_days: '7', forecast_days: '8', timezone: TZ, cell_selection: 'sea',
    });
    let res = await fetchJSON(url, 30000);
    res = Array.isArray(res) ? res : [res];
    const out = { times: res[0].hourly.time, points: [], map: {} };
    res.forEach((r, i) => {
      out.points.push({ grid: [+r.latitude.toFixed(3), +r.longitude.toFixed(3)], h: {
        kt: round(r.hourly.wind_speed_10m, 1), dir: round(r.hourly.wind_direction_10m, 0), gust: round(r.hourly.wind_gusts_10m, 1), rain: round(r.hourly.precipitation, 2) } });
      for (const id of pts[i].ids) out.map[id] = i;
    });
    return out;
  }

  // ── NASA GIBS chlorophyll ──────────────────────────────────────────────────────
  let LUT = null, LUT_LIST = null;
  async function loadLUT() {
    if (LUT) return LUT;
    let entries = lsGet('chlLut:v1', null);
    if (!entries) {
      const r = await fetchWithTimeout(GIBS_CMAP, 20000);
      if (!r.ok) throw new Error('colormap HTTP ' + r.status);
      const xml = await r.text();
      entries = [];
      const re = /<ColorMapEntry rgb="(\d+),(\d+),(\d+)" transparent="false"[^>]*?value="([^"]+)"/g;
      let m;
      while ((m = re.exec(xml))) {
        const nums = m[4].replace(/[\[\]()]/g, '').split(',').map(s => parseFloat(s));
        const lo = nums[0], hi = nums[1];
        const v = (isFinite(lo) && isFinite(hi)) ? Math.sqrt(lo * hi) : (isFinite(lo) ? lo : hi);
        entries.push([+m[1], +m[2], +m[3], v]);
      }
      if (entries.length < 200) throw new Error('unexpected colormap');
      lsSet('chlLut:v1', entries);
    }
    LUT = new Map(entries.map(e => [(e[0] << 16) | (e[1] << 8) | e[2], e[3]]));
    LUT_LIST = entries;
    return LUT;
  }
  const nearCache = new Map();
  function decodeColor(r, g, b) {
    const key = (r << 16) | (g << 8) | b;
    const v = LUT.get(key);
    if (v !== undefined) return v;
    if (nearCache.has(key)) return nearCache.get(key);
    let best = null, bd = 1e9;                     // tolerate small colour-management shifts (e.g. Safari)
    for (const e of LUT_LIST) { const d = (e[0] - r) ** 2 + (e[1] - g) ** 2 + (e[2] - b) ** 2; if (d < bd) { bd = d; best = e[3]; } }
    const out = bd <= 3 * 6 * 6 ? best : null;
    nearCache.set(key, out);
    return out;
  }

  async function decodeImage(blob) {
    let bmp = null;
    try { bmp = await createImageBitmap(blob, { premultiplyAlpha: 'none', colorSpaceConversion: 'none' }); } catch (e) { bmp = null; }
    if (!bmp) {
      bmp = await new Promise((resolve, reject) => {
        const img = new Image(); const url = URL.createObjectURL(blob);
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image decode failed')); };
        img.src = url;
      });
    }
    const w = bmp.width, h = bmp.height;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bmp, 0, 0);
    return { w, h, data: ctx.getImageData(0, 0, w, h).data };
  }

  function sampleAt(img, lat, lon) {
    const px = Math.floor((lon - CHL_BBOX[1]) / CHL_RES), py = Math.floor((CHL_BBOX[2] - lat) / CHL_RES);
    const vals = [];
    for (let r = 0; r <= 6; r++) {
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const x = px + dx, y = py + dy;
        if (x < 0 || y < 0 || x >= img.w || y >= img.h) continue;
        const i = (y * img.w + x) * 4;
        if (img.data[i + 3] < 128) continue;
        const v = decodeColor(img.data[i], img.data[i + 1], img.data[i + 2]);
        if (v != null) vals.push(v);
      }
      if (vals.length >= 3 && r >= 1) break;
    }
    if (!vals.length) return null;
    vals.sort((a, b) => a - b);
    return [vals[Math.floor(vals.length / 2)], vals.length];
  }

  async function chlLayerDay(layer, day, spots, maxAgeMs) {
    const key = `chl:v1:${layer}:${day}`;
    const cached = lsGet(key, null);
    if (cached && (Date.now() - cached.t) < maxAgeMs) return cached.v;
    const W = Math.round((CHL_BBOX[3] - CHL_BBOX[1]) / CHL_RES), H = Math.round((CHL_BBOX[2] - CHL_BBOX[0]) / CHL_RES);
    const url = GIBS_WMS + '?' + new URLSearchParams({ SERVICE: 'WMS', REQUEST: 'GetMap', VERSION: '1.3.0', LAYERS: layer, STYLES: '',
      CRS: 'EPSG:4326', BBOX: CHL_BBOX.join(','), WIDTH: String(W), HEIGHT: String(H), FORMAT: 'image/png', TRANSPARENT: 'TRUE', TIME: day });
    const r = await fetchWithTimeout(url, 25000);
    if (!r.ok) throw new Error('GIBS HTTP ' + r.status);
    const ct = r.headers.get('content-type') || '';
    if (!/image\/png/.test(ct)) throw new Error('GIBS returned ' + ct);
    const img = await decodeImage(await r.blob());
    const v = {};
    for (const s of spots) { const smp = sampleAt(img, s.o[0], s.o[1]); if (smp) v[s.id] = smp; }
    lsSet(key, { t: Date.now(), v });
    return v;
  }

  // Returns {spotId: [{day, chl, n, sensors:[..]}]} oldest → newest.
  async function getChlorophyll(spots, onProgress) {
    await loadLUT();
    const today = todayLocal();
    const jobs = [];
    for (const [layer, weight, days] of CHL_LAYERS) {
      for (let k = 0; k < days; k++) {
        const day = addDays(today, -k);
        const maxAge = k >= 3 ? 30 * 86400000 : 3 * 3600000;   // older days are final; refresh recent ones every 3 h
        jobs.push({ layer, weight, day, maxAge });
      }
    }
    let done = 0;
    const results = await pool(jobs, 4, async job => {
      const v = await chlLayerDay(job.layer, job.day, spots, job.maxAge);
      done++; if (onProgress) onProgress(done / jobs.length);
      return v;
    });
    // prune old cache entries
    try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.startsWith(LS + 'chl:v1:')) { const d = k.slice(-10); if (d < addDays(today, -20)) localStorage.removeItem(k); } } } catch (e) { /* ignore */ }

    const out = {}; let okImages = 0;
    for (const s of spots) out[s.id] = {};
    results.forEach((v, i) => {
      if (!v || v.error) return; okImages++;
      const job = jobs[i];
      for (const [id, [chl, n]] of Object.entries(v)) {
        if (!out[id]) continue;
        const d = out[id][job.day] || (out[id][job.day] = { num: 0, den: 0, n: 0, sensors: [] });
        const w = job.weight * Math.sqrt(n);
        d.num += w * Math.log(chl); d.den += w; d.n += n; d.sensors.push(SENSOR_LABEL[job.layer] || job.layer);
      }
    });
    const series = {};
    for (const [id, days] of Object.entries(out)) {
      series[id] = Object.keys(days).sort().map(day => ({ day, chl: Math.exp(days[day].num / days[day].den), n: days[day].n, sensors: days[day].sensors }));
    }
    return { series, okImages, totalImages: jobs.length };
  }

  // ── NOAA CO-OPS tide predictions (high/low) ────────────────────────────────────
  async function getTides(station, startDay, days) {
    const key = `tide:v1:${station}:${startDay}`;
    const cached = lsGet(key, null);
    if (cached) return cached;
    const url = 'https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?' + new URLSearchParams({
      product: 'predictions', application: 'spearline_vis', begin_date: startDay.replace(/-/g, ''), range: String(days * 24),
      datum: 'MLLW', station, time_zone: 'lst_ldt', units: 'english', interval: 'hilo', format: 'json' });
    const j = await fetchJSON(url, 15000);
    const preds = (j.predictions || []).map(p => ({ t: p.t, ft: +p.v, type: p.type }));
    lsSet(key, preds);
    try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.startsWith(LS + 'tide:v1:') && !k.endsWith(startDay)) localStorage.removeItem(k); } } catch (e) { /* ignore */ }
    return preds;
  }

  root.VisData = { TZ, NATIVE, lsGet, lsSet, lsDel, todayLocal, nowHourKey, addDays, localParts, getMarine, getWeather, getChlorophyll, getTides, CHL_LAYERS, SENSOR_LABEL };
})(typeof window !== 'undefined' ? window : globalThis);

(function () {

  // iOS build: window.SLNative is injected before this file runs (src/native-bridge.js). Every native hook

  function start() {

  const compass = deg => deg == null || isNaN(deg) ? '–' : COMPASS[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  const dayLong = s => dayDate(s).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', timeZone: 'UTC' });
  const mdShort = s => dayDate(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  const hourLabel = h => h === 0 ? '12a' : h < 12 ? `${h}a` : h === 12 ? '12p' : `${h - 12}p`;
  const fmtFt = v => v == null || isNaN(v) ? '–' : String(Math.max(0, Math.round(v)));
  const M2FT = 3.28084;
  // Public pages required by the App Store (privacy policy and support). Links show in the About sheet once set.
  const LINKS = { privacy: 'https://masonchavez341-sudo.github.io/SpearLine-Vis-Site/privacy.html', support: 'https://masonchavez341-sudo.github.io/SpearLine-Vis-Site/support.html' };

  // ── State ─────────────────────────────────────────────────────────────────────
  const S = {
    base: SPOTS.map(s => Object.assign({}, s)),
    spots: [], byId: {},
    raw: null,             // {t, marine, weather, chl}
    results: {},           // spotId -> computed
    days: [], selDay: 0,
    group: D.lsGet('group', GROUPS[0]),
    sort: D.lsGet('sort', 'area'),
    favs: new Set(D.lsGet('favs', [])),
    logs: D.lsGet('logs', []),
    overrides: D.lsGet('overrides', {}),
    alerts: Object.assign({ on: false, ft: 20 }, D.lsGet('alerts', {})),   // iOS only: clear-water notifications
    view: ['list', 'map', 'dives'].includes(D.lsGet('view', 'list')) ? D.lsGet('view', 'list') : 'list',
    diveFilter: '', diveArea: '',
    loading: false, progress: 0, error: null, offline: false,
    openSpot: null,
  };

  function applyOverrides() {
    S.spots = S.base.map(s => Object.assign({}, s, S.overrides[s.id] || {}));
    S.byId = Object.fromEntries(S.spots.map(s => [s.id, s]));
    for (const s of S.spots) s._exp = M.exposureTable(M.decodeProfile(s.prof));
  }

  // ── Compute ───────────────────────────────────────────────────────────────────
  function compute() {
    if (!S.raw) return;
    const { marine, weather, chl } = S.raw;
    const today = D.todayLocal();
    S.days = Array.from({ length: 8 }, (_, i) => D.addDays(today, i));
    const times = marine.times;
    const wIndex = new Map(weather.times.map((t, i) => [t, i]));
    const nowKey = D.nowHourKey();
    const results = {};
    const visLogs = S.logs.filter(l => typeof l.obsFt === 'number');   // dives logged without visibility don't calibrate
    for (const spot of S.spots) {
      const pi = marine.map[spot.id];
      if (pi == null) { results[spot.id] = { missing: true }; continue; }
      const mh = marine.points[pi].h;
      const wp = weather.points[weather.map[spot.id]];
      const n = times.length;
      const pick = (a, b) => (mh[a] || []).map((v, i) => (v != null ? v : (mh[b] ? mh[b][i] : null)));
      const waves = {
        swellH: mh.swell_wave_height, swellT: pick('swell_wave_peak_period', 'swell_wave_period'), swellDir: mh.swell_wave_direction,
        swell2H: mh.secondary_swell_wave_height, swell2T: mh.secondary_swell_wave_period, swell2Dir: mh.secondary_swell_wave_direction,
        windWaveH: mh.wind_wave_height, windWaveT: pick('wind_wave_peak_period', 'wind_wave_period'), windWaveDir: mh.wind_wave_direction,
      };
      const rainIdxAll = wp ? M.rainIndex(wp.h.rain.map(v => v || 0)) : null;
      const kt = new Array(n), dir = new Array(n), gust = new Array(n), rainIdx = new Array(n), rain = new Array(n);
      for (let i = 0; i < n; i++) {
        const j = wIndex.get(times[i]);
        kt[i] = wp && j != null ? wp.h.kt[j] : null; dir[i] = wp && j != null ? wp.h.dir[j] : null; gust[i] = wp && j != null ? wp.h.gust[j] : null;
        rainIdx[i] = rainIdxAll && j != null ? rainIdxAll[j] : 0; rain[i] = wp && j != null ? wp.h.rain[j] : 0;
      }
      const series = (chl && chl.series && chl.series[spot.id]) || [];
      const now = M.chlNowcast(series, today);
      const chlByDay = {};
      for (let k = -3; k < 8; k++) { const d = D.addDays(today, k); chlByDay[d] = now ? M.chlForDay(now, Math.max(0, k)) : null; }
      const run = M.runSpot({ spot, expTable: spot._exp, times, waves, wind: { kt, dir }, rainMm: rain, rainIdx, chlByDay, calib: 1 });
      const cal = M.calibration(visLogs, spot.id, spot.group, Date.now());
      const daily = S.days.map((d, k) => summarizeDay(run, times, d, k, now, cal, waves, { kt, dir, gust, rain }));
      results[spot.id] = { run, times, waves, wind: { kt, dir, gust, rain }, chlNow: now, chlSeries: series, cal, daily, grid: marine.points[pi].grid, nowIdx: times.indexOf(nowKey) };
    }
    S.results = results;
    if (NATIVE) scheduleAlerts();
  }

  // ── Clear-water alerts (iOS only) ─────────────────────────────────────────────
  // After every compute: replace pending alerts with at most one per day for days 1–3, sent at 6 PM local the
  // evening before, listing saved spots whose morning estimate meets the threshold with better than Low confidence.
  function laInstant(day, hour) {           // ms timestamp of `day` at `hour`:00 in America/Los_Angeles
    let t = Date.parse(`${day}T${String(hour).padStart(2, '0')}:00:00Z`);
    for (let i = 0; i < 2; i++) { const p = D.localParts(new Date(t)); t += Date.parse(`${day}T${String(hour).padStart(2, '0')}:00:00Z`) - Date.parse(`${p.day}T${String(p.hour).padStart(2, '0')}:00:00Z`); }
    return t;
  }
  function buildAlerts() {
    const out = [], now = Date.now();
    for (let k = 1; k <= 3 && k < S.days.length; k++) {
      const hits = [];
      for (const id of S.favs) {
        const s = S.byId[id], r = S.results[id];
        if (!s || !r || !r.daily) continue;
        const d = r.daily[k];
        if (d && d.am != null && d.am >= S.alerts.ft && d.conf.level !== 'Low') hits.push([s.name, d.am]);
      }
      if (!hits.length) continue;
      const at = laInstant(S.days[k - 1], 18);
      if (at <= now) continue;
      hits.sort((a, b) => b[1] - a[1]);
      const list = hits.slice(0, 4).map(([n, v]) => `${n} ${fmtFt(v)} ft`).join(', ') + (hits.length > 4 ? ` and ${hits.length - 4} more` : '');
      out.push({ id: 100 + k, at, title: 'Clear water tomorrow', body: `${list} (7–10 AM estimate)`, day: S.days[k] });
    }
    return out;
  }
  function scheduleAlerts() {
    if (!NATIVE || !N.alerts || !S.alerts.on) return;
    try { const p = N.alerts.schedule(buildAlerts()); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ignore */ }
  }
  async function setAlertsOn(on) {
    if (!NATIVE || !N.alerts) return;
    if (on) {
      let ok = false;
      try { ok = await N.alerts.enable(); } catch (e) { ok = false; }
      if (!ok) {
        S.alerts.on = false; D.lsSet('alerts', S.alerts);
        const cb = $('#alertsOn'); if (cb) cb.checked = false;
        alertInline('Notifications are off for SpearLine Vis. To get alerts, allow them in the iPhone Settings app under Notifications → SpearLine Vis, then turn this on again.');
        return;
      }
      S.alerts.on = true; D.lsSet('alerts', S.alerts); scheduleAlerts();
    } else {
      S.alerts.on = false; D.lsSet('alerts', S.alerts);
      try { await N.alerts.disable(); } catch (e) { /* ignore */ }
    }
  }

  function summarizeDay(run, times, day, k, chlNow, cal, waves, wind) {
    const idx = h => times.indexOf(`${day}T${String(h).padStart(2, '0')}:00`);
    const mean = hs => { const v = hs.map(idx).filter(i => i >= 0).map(i => run.vis[i]); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
    const am = mean([7, 8, 9, 10]), pm = mean([13, 14, 15, 16]);
    let best = null, bestH = null;
    for (let h = 6; h <= 16; h++) { const v = mean([h, h + 1, h + 2]); if (v != null && (best == null || v > best + 0.25)) { best = v; bestH = h; } }
    const i8 = idx(8);
    const p = i8 >= 0 ? run.parts[i8] : null;
    const conf = M.confidence({ chlAge: chlNow ? chlNow.age : null, leadDays: k, hSiteFt: p ? p.hSite * M2FT : 0, rainIdxMm: p ? p.rainIdx : 0, nLogs: cal.nSpot });
    const c = cal.mult;
    return { day, am: am == null ? null : am * c, pm: pm == null ? null : pm * c, best: best == null ? null : best * c, bestH, conf, i8,
      breakAm: mean([7, 8, 9, 10]) != null && run.visBreak[i8] != null ? avgIdx(run.visBreak, [7, 8, 9, 10].map(idx)) * c : null,
      openAm: run.visOpen[i8] != null ? avgIdx(run.visOpen, [7, 8, 9, 10].map(idx)) * c : null };
  }
  const avgIdx = (arr, ids) => { const v = ids.filter(i => i >= 0 && arr[i] != null).map(i => arr[i]); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };

  // ── Data loading ──────────────────────────────────────────────────────────────
  async function load(force) {
    if (S.loading) return;
    S.loading = true; S.error = null; S.progress = 0; renderStatus();
    try {
      const [marine, weather] = await Promise.all([D.getMarine(S.spots), D.getWeather(S.spots)]);
      let chl = null, chlErr = null;
      try { chl = await D.getChlorophyll(S.spots, p => { S.progress = p; renderStatus(); }); }
      catch (e) { chlErr = e; }
      if (!chl && S.raw && S.raw.chl) chl = S.raw.chl;
      S.raw = { t: Date.now(), marine, weather, chl, chlErr: chlErr ? String(chlErr.message || chlErr) : null };
      S.offline = false;
      D.lsSet('snapshot:v1', S.raw) || D.lsDel('snapshot:v1');
      compute();
    } catch (e) {
      S.error = String(e && e.message || e);
      if (!S.raw) { const snap = D.lsGet('snapshot:v1', null); if (snap) { S.raw = snap; S.offline = true; compute(); } }
    } finally {
      S.loading = false; render();
    }
  }

  // ── Species (dive journal) ────────────────────────────────────────────────────
  const SPECIES = ['Calico bass', 'Sand bass', 'Sheephead', 'Yellowtail', 'White seabass', 'California halibut', 'Lingcod',
    'Vermilion rockfish', 'Other rockfish', 'Cabezon', 'Scorpionfish (sculpin)', 'Opaleye', 'Halfmoon', 'Barracuda', 'Bonito',
    'Bluefin tuna', 'Yellowfin tuna', 'Dorado', 'Spiny lobster', 'Garibaldi', 'Giant sea bass', 'Bat ray', 'Leopard shark',
    'Horn shark', 'Mola mola', 'Octopus', 'Sea lion'];
  // No-take species in California; the dive form warns if one is logged as caught.
  const PROTECTED = new Set(['Garibaldi', 'Giant sea bass']);
  const isDive = l => l && (l.lat != null || l.caught || l.seen);
  const kmBetween = (a, b, c, d) => { const r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r; return 6371 * Math.hypot(x, y); };
  function nearestSpot(lat, lon) {
    let best = null, bd = Infinity;
    for (const s of S.spots) { const d = kmBetween(lat, lon, s.lat, s.lon); if (d < bd) { bd = d; best = s; } }
    return best ? { spot: best, km: bd } : null;
  }
  const logPos = l => (l.lat != null ? [l.lat, l.lon] : (S.byId[l.spotId] ? [S.byId[l.spotId].lat, S.byId[l.spotId].lon] : null));
  function logGroup(l) {
    if (l.spotId && S.byId[l.spotId]) return S.byId[l.spotId].group;
    const p = logPos(l); if (!p) return null;
    const n = nearestSpot(p[0], p[1]); return n && n.km <= 15 ? n.spot.group : null;
  }
  const inArea = l => !S.diveArea || logGroup(l) === S.diveArea;
  const speciesOf = l => [...new Set([...(l.caught || []).map(c => c.sp), ...(l.seen || [])])];
  const matchesFilter = l => !S.diveFilter || speciesOf(l).includes(S.diveFilter);
  function whenLabel(l) {
    if (l.when) { const h = +l.when.slice(11, 13), m = l.when.slice(14, 16); return `${dayLong(l.when.slice(0, 10))}, ${h % 12 === 0 ? 12 : h % 12}:${m} ${h < 12 ? 'AM' : 'PM'}`; }
    return new Date(l.t).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  }
  function placeName(l) {
    if (l.spotId && S.byId[l.spotId]) return S.byId[l.spotId].name;
    const p = logPos(l); if (!p) return 'Unknown place';
    const n = nearestSpot(p[0], p[1]);
    return n ? `${n.km < 1 ? 'Near' : `${n.km.toFixed(1)} km from`} ${n.spot.name}` : `${p[0].toFixed(4)}, ${p[1].toFixed(4)}`;
  }
