    const species = [...new Set(S.logs.flatMap(speciesOf))].sort();
    if (S.diveFilter && !species.includes(S.diveFilter)) S.diveFilter = '';
    const shown = area.filter(matchesFilter).sort((a, b) => b.t - a.t);
    const tally = {};
    for (const l of area) {
      for (const c of l.caught || []) { const t = tally[c.sp] || (tally[c.sp] = { seen: 0, caught: 0, last: 0 }); t.caught += c.n || 1; t.last = Math.max(t.last, l.t); }
      for (const sp of l.seen || []) { const t = tally[sp] || (tally[sp] = { seen: 0, caught: 0, last: 0 }); t.seen += 1; t.last = Math.max(t.last, l.t); }
    }
    const rows = Object.entries(tally).sort((a, b) => b[1].last - a[1].last);
    const areaName = S.diveArea || 'all areas';
    host.innerHTML = `
      <div class="dhead-row">
        <select id="diveArea" aria-label="Area"><option value="">All areas</option>${GROUPS.map(g => `<option${g === S.diveArea ? ' selected' : ''}>${esc(g)}</option>`).join('')}</select>
        <select id="diveSpecies" aria-label="Show dives with species"><option value="">All species</option>${species.map(sp => `<option${sp === S.diveFilter ? ' selected' : ''}>${esc(sp)}</option>`).join('')}</select>
        </div><div class="dhead-row"><button class="btn primary" data-act="newDive">Log a dive on the map</button>
      </div>
      ${rows.length ? `<section class="panel"><h2>Species log <small>${esc(areaName)}</small></h2>
        <div class="tally"><span class="h">Species</span><span class="h n">Seen</span><span class="h n">Caught</span><span class="h">Last</span>
        ${rows.map(([sp, t]) => `<span>${esc(sp)}${PROTECTED.has(sp) ? ' <span class="muted small">(protected)</span>' : ''}</span><span class="n">${t.seen}</span><span class="n">${t.caught}</span><span class="muted small">${esc(new Date(t.last).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }))}</span>`).join('')}
        </div></section>` : ''}
      ${shown.length ? shown.map(l => `<button class="divecard" data-dive="${esc(l.id)}">
          <div><b>${esc(placeName(l))}</b></div>
          <div class="when">${esc(whenLabel(l))}</div>
          <div class="what">${[typeof l.obsFt === 'number' ? `saw ${fmtFt(l.obsFt)} ft` : '', l.depthFt ? `${l.depthFt} ft deep` : '', l.tempF ? `${l.tempF}°F` : '', l.surge ? `${l.surge} surge` : '', l.color ? `${l.color} water` : ''].filter(Boolean).join(' · ') || 'No conditions noted'}</div>
          ${speciesOf(l).length ? `<div class="tags">${(l.caught || []).map(c => `<span class="tag caught">${esc(c.sp)} ×${c.n || 1}${c.lb ? ` · ${c.lb} lb` : ''}</span>`).join('')}${(l.seen || []).filter(sp => !(l.caught || []).some(c => c.sp === sp)).map(sp => `<span class="tag${PROTECTED.has(sp) ? ' protected' : ''}">${esc(sp)}</span>`).join('')}</div>` : ''}
          ${l.note ? `<div class="what">${esc(l.note)}</div>` : ''}
        </button>`).join('')
        : `<p class="empty">${S.diveFilter ? `No ${esc(S.diveFilter)} logged in ${esc(areaName)} yet.` : `No dives logged in ${esc(areaName)} yet. Log one from the map, or from a spot's page.`}</p>`}`;
  }

  // ── Rendering: shell ──────────────────────────────────────────────────────────
  function render() {
    renderStatus(); renderTabs(); renderDays();
    document.querySelectorAll('.viewseg button').forEach(b => { const on = b.dataset.view === S.view; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
    renderView();
    if (S.openSpot) renderDetail();
  }

  function renderStatus() {
    const el = $('#status');
    if (!el) return;
    let html = '';
    if (S.loading) {
      const pct = Math.round(S.progress * 100);
      html = `<span class="dot live"></span>Pulling waves, wind${S.progress > 0 ? ` and satellite chlorophyll (${pct}%)` : ' and satellite data'}…`;
    } else if (S.error && !S.raw) {
      html = `<span class="dot err"></span>Couldn’t load data: ${esc(S.error)}. <button class="link" data-act="reload">Try again</button>`;
    } else if (S.raw) {
      const t = new Date(S.raw.t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: D.TZ });
      const newest = newestChlDay();
      html = `<span class="dot ${S.offline || S.error ? 'warn' : 'ok'}"></span>${S.offline ? 'Offline copy from' : 'Updated'} ${esc(t)}` +
        (newest ? ` · satellite ${esc(mdShort(newest))}` : ' · no recent satellite pass') +
        (S.error ? ` · <button class="link" data-act="reload">retry</button>` : '');
    }
    el.innerHTML = html;
  }
  function newestChlDay() {
    let best = null;
    for (const r of Object.values(S.results)) if (r.chlNow && (!best || r.chlNow.newestDay > best)) best = r.chlNow.newestDay;
    return best;
  }

  function tabList() { return (S.favs.size ? ['★ Saved'] : []).concat(GROUPS); }
  function renderTabs() {
    const tabs = tabList();
    if (!tabs.includes(S.group)) S.group = GROUPS[0];
    $('#tabs').innerHTML = tabs.map(g => `<button role="tab" aria-selected="${g === S.group}" class="tab${g === S.group ? ' on' : ''}" data-group="${esc(g)}">${esc(g)}</button>`).join('');
  }
  function renderDays() {
    const el = $('#days');
    if (!S.days.length) { el.innerHTML = ''; return; }
    el.innerHTML = S.days.map((d, i) => `<button class="day${i === S.selDay ? ' on' : ''}" data-day="${i}" aria-pressed="${i === S.selDay}"><b>${esc(dayShort(d, i))}</b><span>${esc(mdShort(d))}</span></button>`).join('');
    $('#sortBtn').textContent = S.sort === 'area' ? 'Sort: by area' : 'Sort: clearest first';
  }

  function visCell(v, extraClass) {
    const t = v == null ? -1 : M.tier(v);
    return `<span class="cell t${t}${extraClass ? ' ' + extraClass : ''}">${fmtFt(v)}</span>`;
  }
  function rangeText(v, conf) {
    if (v == null) return '–';
    if (conf.level === 'High') return `${fmtFt(v)}`;
    return `${fmtFt(v * (1 - conf.half))}–${fmtFt(v * (1 + conf.half))}`;
  }

  function renderList() {
    const el = $('#list');
    if (!S.raw) {
      el.innerHTML = S.loading ? Array.from({ length: 5 }, () => '<div class="card skeleton"></div>').join('') : '';
      return;
    }
    let spots = S.group === '★ Saved' ? S.spots.filter(s => S.favs.has(s.id)) : S.spots.filter(s => s.group === S.group);
    const dayI = S.selDay;
    const am = s => { const r = S.results[s.id]; return r && r.daily ? r.daily[dayI].am : -1; };
    if (S.sort === 'vis') spots = spots.slice().sort((a, b) => am(b) - am(a));
    else if (S.group === 'Ventura / Rincon') spots = spots.slice().sort((a, b) => a.lon - b.lon);   // up the coast, Rincon to Ormond
    let html = '', lastIsland = null;
    for (const s of spots) {
      const r = S.results[s.id];
      if (S.sort === 'area' && s.island && s.island !== lastIsland) { html += `<h3 class="island">${esc(s.island)}</h3>`; lastIsland = s.island; }
      if (!r || r.missing) { html += `<div class="card"><div class="card-top"><div><div class="name">${esc(s.name)}</div><div class="sub">No wave-model data for this spot right now</div></div></div></div>`; continue; }
      const d = r.daily[dayI];
      const bestK = r.daily.reduce((bi, x, i, arr) => (x.am != null && (arr[bi].am == null || x.am > arr[bi].am) ? i : bi), 0);
      html += `<button class="card${d.am != null ? ' e' + M.tier(d.am) : ''}" data-spot="${esc(s.id)}" aria-label="${esc(s.name)}: ${fmtFt(d.am)} feet ${esc(M.rating(d.am || 0))}">
        <div class="card-top">
          <div class="card-id">
            <div class="name">${S.favs.has(s.id) ? '<span class="star" aria-hidden="true">★</span>' : ''}${esc(s.name)}</div>
            <div class="sub">${esc(s.access === 'shore' ? 'Shore' : 'Boat')} · ${s.depth} ft · faces ${esc(compass(s.facing))}${s.island && S.sort !== 'area' ? ' · ' + esc(s.island) : ''}</div>
          </div>
          <div class="hero-mini">
            <div class="big">${fmtFt(d.am)}<small>ft</small></div>
            <div class="lvl">${esc(M.rating(d.am || 0))} · ${esc(d.conf.level.toLowerCase())}</div>
          </div>
        </div>
        <div class="strip" aria-hidden="true">${r.daily.map((x, i) => `<span class="sc${i === dayI ? ' sel' : ''}${i === bestK ? ' best' : ''}"><i>${esc(dayShort(x.day, i).slice(0, i === 0 ? 5 : 3))}</i>${visCell(x.am)}</span>`).join('')}</div>
      </button>`;
    }
    if (!spots.length) html = `<p class="empty">No saved spots yet. Open a spot and tap ☆ to save it here.</p>`;
    el.innerHTML = html;
  }

  // ── Detail view ───────────────────────────────────────────────────────────────
  function openDetail(id) { S.openSpot = id; document.body.classList.add('noscroll'); renderDetail(); $('#detail').hidden = false; $('#detail').scrollTop = 0; history.pushState({ spot: id }, ''); }
  function closeDetail() { S.openSpot = null; $('#detail').hidden = true; document.body.classList.remove('noscroll'); }

  function chip(icon, title, value, impactFt, note) {
    let cls = 'neutral', word = 'neutral';
    if (impactFt != null) { if (impactFt >= 1) { cls = 'good'; word = 'helps'; } else if (impactFt <= -1.5) { cls = 'bad'; word = 'hurts'; } }
    const imp = impactFt == null ? '' : `<span class="imp ${cls}"><span aria-hidden="true">${cls === 'good' ? '▲' : cls === 'bad' ? '▼' : '•'}</span> ${impactFt >= 0.5 ? '+' : ''}${Math.round(impactFt)} ft · ${word}</span>`;
    return `<div class="chip"><div class="chip-ic" aria-hidden="true">${icon}</div><div class="chip-body"><div class="chip-t">${esc(title)}</div><div class="chip-v">${esc(value)}</div>${note ? `<div class="chip-n">${esc(note)}</div>` : ''}${imp}</div></div>`;
  }
  function chlLabel(c) { return c < 0.3 ? 'Clean water' : c < 0.6 ? 'Light plankton' : c < 1.5 ? 'Moderate plankton' : c < 4 ? 'Plankton bloom' : 'Heavy bloom'; }
  function onshoreWord(w) { return w >= 0.8 ? 'onshore' : w >= 0.45 ? 'cross-shore' : 'offshore'; }

  function renderDetail() {
    const s = S.byId[S.openSpot], r = S.results[S.openSpot];
    const el = $('#detailBody');
    if (!s) return;
    $('#detailTitle').textContent = s.name;
    $('#favBtn').textContent = S.favs.has(s.id) ? '★' : '☆';
    $('#favBtn').setAttribute('aria-label', S.favs.has(s.id) ? 'Remove from saved' : 'Save spot');
    if (!r || r.missing) { el.innerHTML = '<p class="empty">No data for this spot yet.</p>'; return; }
    const k = S.selDay, d = r.daily[k], p = d.i8 >= 0 ? r.run.parts[d.i8] : null, cal = r.cal.mult;
    const i8 = d.i8;
    const sw = i8 >= 0 ? { h: r.waves.swellH[i8], t: r.waves.swellT[i8], dir: r.waves.swellDir[i8] } : null;
    const chlNow = r.chlNow;
    const chlVal = p ? p.chl : null;
    const chlNote = chlNow ? (k === 0 && chlNow.age <= 1 ? `satellite, ${mdShort(chlNow.newestDay)}` : `from satellite pass ${mdShort(chlNow.newestDay)}, carried forward`) : 'no clear satellite pass in 14 days — using a typical value';

    const chips = [];
    if (p) {
      chips.push(chip('🟢', chlVal != null ? chlLabel(chlVal) : 'Plankton unknown', chlVal != null ? `${chlVal.toFixed(2)} mg/m³ chlorophyll` : 'assumed 0.40 mg/m³', chlVal != null ? M.planktonImpactFt(p, cal) : null, chlNote));
      chips.push(chip('🌊', 'Bottom surge', `${(p.hSite * M2FT).toFixed(1)} ft at the spot · ${sw && sw.t ? Math.round(sw.t) + ' s' : '–'} from ${compass(sw && sw.dir)}`, -M.termImpactFt(p, 'cRs', cal), `near-bed wave velocity ${p.u.toFixed(2)} m/s at ${s.depth} ft (sand starts moving ≈0.20)`));
      chips.push(chip('🧭', 'Swell exposure', p.exposure != null ? `${Math.round(p.exposure * 100)}% of the ${compass(sw && sw.dir)} swell reaches the spot` : '–', null, `offshore swell ${(sw && sw.h != null ? sw.h * M2FT : 0).toFixed(1)} ft; spot faces ${compass(s.facing)}`));
      const wkt = r.wind.kt[i8], wdir = r.wind.dir[i8];
      chips.push(chip('💨', 'Wind & chop', wkt != null ? `${Math.round(wkt)} kt from ${compass(wdir)} (${onshoreWord(p.windWeight)})` : '–', -M.termImpactFt(p, 'cWind', cal), '8 AM value; chop penalty starts ~6 kt onshore'));
      const rainIn = p.rainIdx / 25.4;
      chips.push(chip('🌧️', 'Rain & runoff', rainIn >= 0.01 ? `${rainIn.toFixed(2)} in runoff index (72 h decay)` : 'Dry — no recent rain', p.cRo > 0 ? -M.termImpactFt(p, 'cRo', cal) : 0, s.R >= 0.7 ? 'plume-prone spot (river mouths nearby)' : s.R <= 0.15 ? 'island — little runoff' : null));
      chips.push(chip('🎯', 'Spot baseline', `${s.vref} ft on a clean, flat day`, null, 'starting estimate — tune it below or let your dive log correct it'));
      chips.push(chip('📓', 'Your calibration', r.cal.nSpot ? `×${cal.toFixed(2)} from ${r.cal.nSpot} dive${r.cal.nSpot > 1 ? 's' : ''} here` : r.cal.nGroup ? `×${cal.toFixed(2)} from ${r.cal.nGroup} dive${r.cal.nGroup > 1 ? 's' : ''} in this area` : 'No dive logs yet', null, 'log what you actually saw to tune the model'));
    }

    const zones = s.access === 'shore' && d.breakAm != null ? `
      <div class="zones" role="group" aria-label="Visibility by distance from shore">
        <div><span class="zl">Break zone</span><span class="zv">${fmtFt(d.breakAm)}<small>ft</small></span><span class="zs">0–50 ft out</span></div>
        <div class="zhead"><span class="zl">Past the break</span><span class="zv">${fmtFt(d.am)}<small>ft</small></span><span class="zs">50–200 ft · headline</span></div>
        <div><span class="zl">Open water</span><span class="zv">${fmtFt(d.openAm)}<small>ft</small></span><span class="zs">200+ ft out</span></div>
      </div>` : '';

    const rows = [6, 9, 12, 15, 18].map(h => {
      const i = r.times.indexOf(`${d.day}T${String(h).padStart(2, '0')}:00`);
      if (i < 0) return '';
      const pp = r.run.parts[i];
      return `<tr><th scope="row">${hourLabel(h)}</th><td>${fmtFt(r.run.vis[i] * cal)} ft</td><td>${(pp.hSite * M2FT).toFixed(1)} ft · ${r.waves.swellT[i] ? Math.round(r.waves.swellT[i]) : '–'}s ${compass(r.waves.swellDir[i])}</td><td>${r.wind.kt[i] != null ? Math.round(r.wind.kt[i]) : '–'} kt ${compass(r.wind.dir[i])}</td></tr>`;
    }).join('');

    el.innerHTML = `
      <div class="meta">${esc(s.access === 'shore' ? 'Shore dive' : 'Boat dive')} · ~${s.depth} ft · faces ${esc(compass(s.facing))} · ${esc(s.island ? s.island + ', ' : '')}${esc(s.group)}</div>
      <div class="days in-detail">${S.days.map((dd, i) => `<button class="day${i === k ? ' on' : ''}" data-day="${i}" aria-pressed="${i === k}"><b>${esc(dayShort(dd, i))}</b>${visCell(r.daily[i].am, 'mini')}</button>`).join('')}</div>
      <section class="hero">
        <div class="hero-num">${fmtFt(d.am)}<span>ft</span></div>
        <div class="hero-side">
          <div class="hero-rating">${esc(M.rating(d.am || 0))}</div>
          <div class="hero-conf"><span class="conf ${d.conf.level.toLowerCase()}"></span>${esc(d.conf.level)} confidence · likely ${esc(rangeText(d.am, Object.assign({}, d.conf, { level: 'x' })))} ft</div>
          <div class="hero-when">${esc(dayLong(d.day))} · 7–10 AM average</div>
        </div>
      </section>
      <div class="hero-sub">Afternoon ${fmtFt(d.pm)} ft · clearest ${d.bestH != null ? `${hourLabel(d.bestH)}–${hourLabel(d.bestH + 3)}` : '–'} (${fmtFt(d.best)} ft)</div>
      <section class="panel">
        <h2>Through the day</h2>
        <div id="hourly" class="chart"></div>
      </section>
      ${zones}
      <section class="panel">
        <h2>Why this number <small>at 8 AM</small></h2>
        <div class="chips">${chips.join('')}</div>
      </section>
      <section class="panel">
        <h2>Conditions at the spot</h2>
        <table class="cond"><thead><tr><th></th><th>Vis</th><th>Swell at spot</th><th>Wind</th></tr></thead><tbody>${rows}</tbody></table>
      </section>
      <section class="panel" id="tides"><h2>Tides <small>${esc(TIDE_STATIONS[s.tide] || '')}</small></h2><div class="tide-body muted">Loading…</div></section>
      <div class="actions">
        <button class="btn primary" data-act="log">Log what you saw</button>
        <button class="btn" data-act="tune">Tune this spot</button>
      </div>
      <p class="prov">${extLink('https://open-meteo.com/', 'Weather data by Open-Meteo.com')} (waves: marine cell ${r.grid ? r.grid.join(', ') : '–'}; wind &amp; rain), modified into visibility estimates · Chlorophyll: NASA GIBS ${esc(chlNow ? [...new Set(r.chlSeries.slice(-3).flatMap(x => x.sensors))].join(', ') : '—')} · Estimates only. Conditions change fast; dive at your own risk.</p>`;
    drawHourly(r, d);
    loadTides(s, d.day);
  }

  async function loadTides(s, day) {
    const box = $('#tides .tide-body');
    try {
      const preds = await D.getTides(s.tide, S.days[0], 8);
      if (S.openSpot !== s.id) return;
      const list = preds.filter(p => p.t.startsWith(day));
      box.classList.remove('muted');
      box.innerHTML = list.length ? list.map(p => {
        const h = +p.t.slice(11, 13), m = p.t.slice(14, 16);
        const t = `${h % 12 === 0 ? 12 : h % 12}:${m} ${h < 12 ? 'AM' : 'PM'}`;
        return `<span class="tide"><b>${p.type === 'H' ? 'High' : 'Low'}</b> ${esc(t)} <span class="muted">${p.ft.toFixed(1)} ft</span></span>`;
      }).join('') : '<span class="muted">No tide predictions for this day.</span>';
    } catch (e) { if (box) box.innerHTML = '<span class="muted">Tides unavailable right now.</span>'; }
  }

  // Hourly visibility line with confidence band, crosshair + tooltip.
  function drawHourly(r, d) {
    const host = $('#hourly');
    const hours = []; for (let h = 5; h <= 20; h++) { const i = r.times.indexOf(`${d.day}T${String(h).padStart(2, '0')}:00`); if (i >= 0) hours.push({ h, v: r.run.vis[i] * r.cal.mult }); }
    if (!hours.length) { host.innerHTML = '<p class="muted">No hourly data for this day.</p>'; return; }
    const W = 340, H = 150, L = 30, R = 10, T = 10, B = 24;
    const half = d.conf.half;
    const vmax = Math.max(10, ...hours.map(x => x.v * (1 + half)));
    const step = vmax > 40 ? 20 : vmax > 20 ? 10 : 5;
    const top = Math.ceil(vmax / step) * step;
    const x = h => L + (h - 5) / 15 * (W - L - R);
    const y = v => T + (1 - v / top) * (H - T - B);
    const line = hours.map((p, i) => `${i ? 'L' : 'M'}${x(p.h).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    const band = hours.map((p, i) => `${i ? 'L' : 'M'}${x(p.h).toFixed(1)},${y(p.v * (1 + half)).toFixed(1)}`).join('') +
      hours.slice().reverse().map(p => `L${x(p.h).toFixed(1)},${y(p.v * (1 - half)).toFixed(1)}`).join('') + 'Z';
    let grid = '';
    for (let v = 0; v <= top; v += step) grid += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
    let xt = '';
    for (const h of [6, 9, 12, 15, 18]) xt += `<text class="ax" x="${x(h)}" y="${H - 6}" text-anchor="middle">${hourLabel(h)}</text>`;
    const win = `<rect class="win" x="${x(7)}" y="${T}" width="${x(10) - x(7)}" height="${H - T - B}"/><text class="ax winlbl" x="${(x(7) + x(10)) / 2}" y="${T + 10}" text-anchor="middle">dive window</text>`;
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hourly visibility forecast in feet">${win}${grid}<line class="base" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>${xt}
      <path class="band" d="${band}"/><path class="ln" d="${line}"/>
      <line class="xh" y1="${T}" y2="${H - B}" x1="-10" x2="-10"/><circle class="xd" r="4.5" cx="-10" cy="-10"/>
      <rect class="hit" x="${L}" y="0" width="${W - L - R}" height="${H}"/></svg><div class="tip" hidden></div>`;
    const svg = host.querySelector('svg'), tip = host.querySelector('.tip'), xh = host.querySelector('.xh'), xd = host.querySelector('.xd');
    const show = ev => {
      const rect = svg.getBoundingClientRect();
      const px = (ev.clientX - rect.left) / rect.width * W;
      let best = hours[0]; for (const p of hours) if (Math.abs(x(p.h) - px) < Math.abs(x(best.h) - px)) best = p;
      xh.setAttribute('x1', x(best.h)); xh.setAttribute('x2', x(best.h));
      xd.setAttribute('cx', x(best.h)); xd.setAttribute('cy', y(best.v));
      tip.hidden = false;
      tip.textContent = '';
      const b = document.createElement('b'); b.textContent = `${fmtFt(best.v)} ft`;
      const sp = document.createElement('span'); sp.textContent = ` ${hourLabel(best.h)} · ${fmtFt(best.v * (1 - half))}–${fmtFt(best.v * (1 + half))} ft`;
      tip.append(b, sp);
      const left = x(best.h) / W * rect.width;
      tip.style.left = Math.min(Math.max(left, 60), rect.width - 60) + 'px';
    };
    const hide = () => { tip.hidden = true; xh.setAttribute('x1', -10); xh.setAttribute('x2', -10); xd.setAttribute('cx', -10); };
    svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', hide);
  }

  // ── Sheets: log a dive, tune a spot, settings, about ──────────────────────────
  function openSheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').hidden = false; document.body.classList.add('noscroll'); const f = $('#sheetBody input, #sheetBody select, #sheetBody button'); if (f) f.focus(); }
  function closeSheet() { $('#sheet').hidden = true; if (!S.openSpot) document.body.classList.remove('noscroll'); }

  // ── Dive sheet: log or edit a dive (location, time, conditions, fish) ─────────
  // opts: { spotId } from a spot page · { lat, lon } from the map · { id } to edit.
  // Entries live in S.logs. Only entries with a visibility number feed the model's calibration.
  let DS = null;
  function diveSheet(opts) {
    const edit = opts.id ? S.logs.find(l => l.id === opts.id) : null;
    const pos = edit ? logPos(edit) : (opts.lat != null ? [opts.lat, opts.lon] : (S.byId[opts.spotId] ? [S.byId[opts.spotId].lat, S.byId[opts.spotId].lon] : null));
    let spotId = edit ? edit.spotId || '' : opts.spotId || '';
    if (!edit && !spotId && pos) { const n = nearestSpot(pos[0], pos[1]); if (n && n.km <= 3) spotId = n.spot.id; }
    DS = { id: edit ? edit.id : null, lat: pos ? pos[0] : null, lon: pos ? pos[1] : null, fromMap: !edit && opts.lat != null,
      surge: edit && edit.surge || '', current: edit && edit.current || '', color: edit && edit.color || '',
      seen: new Set(edit && edit.seen || []) };
    const r = S.results[spotId] || Object.values(S.results).find(x => x && x.times);
    const nowKey = D.nowHourKey();
    const opts48 = [];
    if (r && r.times) { const ni = r.times.indexOf(nowKey); for (let i = Math.max(0, ni - 47); i <= ni; i++) opts48.push(r.times[i]); }
    opts48.reverse();
    const editWhen = edit && edit.when;
    const inList = editWhen && opts48.includes(editWhen);
    const timeOpts = (opts48.length ? opts48 : [nowKey]).map((t, i) => { const h = +t.slice(11, 13); return `<option value="${t}"${(edit ? inList && t === editWhen : i === 0) ? ' selected' : ''}>${esc(mdShort(t.slice(0, 10)))} ${hourLabel(h)}</option>`; }).join('')
      + `<option value="other"${edit && !inList ? ' selected' : ''}>Another date…</option>`;
    const byDist = pos ? S.spots.map(s => [s, kmBetween(pos[0], pos[1], s.lat, s.lon)]).sort((a, b) => a[1] - b[1]) : S.spots.map(s => [s, null]);
    const spotOpts = `<option value="">Not at a listed spot</option>` + byDist.map(([s, km]) => `<option value="${esc(s.id)}"${s.id === spotId ? ' selected' : ''}>${esc(s.name)}${km != null ? ` (${km < 1 ? '<1' : km.toFixed(km < 10 ? 1 : 0)} km)` : ''}</option>`).join('');
    const seg = (k, vals) => `<div class="seg" role="group">${vals.map(v => `<button type="button" data-act="seg" data-k="${k}" data-v="${v}" class="${DS[k] === v ? 'on' : ''}" aria-pressed="${DS[k] === v}">${v}</button>`).join('')}</div>`;
    const caughtRows = (edit && edit.caught || []).map(fishRow).join('');
    openSheet(`<h2>${edit ? 'Edit dive' : 'Log a dive'}${spotId && S.byId[spotId] ? ` · ${esc(S.byId[spotId].name)}` : ''}</h2>
      ${pos ? `<p class="muted small">${DS.fromMap || (edit && edit.lat != null) ? 'Pinned at' : 'At'} ${pos[0].toFixed(4)}, ${pos[1].toFixed(4)}</p>` : ''}
      <label>Spot<select id="logSpot">${spotOpts}</select></label>
      <label>When<select id="logTime">${timeOpts}</select></label>
      <label id="logDateWrap"${edit && !inList ? '' : ' hidden'}>Date and time<input id="logDate" type="datetime-local" value="${edit && editWhen && !inList ? esc(editWhen.slice(0, 16)) : ''}"></label>
      <label>Visibility you saw (ft)<input id="logVis" type="number" inputmode="decimal" min="0" max="150" step="1" placeholder="e.g. 15" value="${edit && typeof edit.obsFt === 'number' ? edit.obsFt : ''}"><small class="muted">Tunes this spot's forecast. Leave blank if you didn't judge it.</small></label>
      <div class="row2">
        <label>Depth (ft)<input id="logDepth" type="number" inputmode="decimal" min="0" max="300" value="${edit && edit.depthFt || ''}"></label>
        <label>Water temp (°F)<input id="logTempF" type="number" inputmode="decimal" min="40" max="90" value="${edit && edit.tempF || ''}"></label>
      </div>
      <h3>Surge</h3>${seg('surge', ['none', 'light', 'moderate', 'strong'])}
      <h3>Current</h3>${seg('current', ['none', 'light', 'strong'])}
      <h3>Water colour</h3>${seg('color', ['blue', 'green', 'brown'])}
      <h3>Fish caught</h3>
      <div id="caughtRows">${caughtRows}</div>
      <p id="protWarn" class="warnline" hidden></p>
      <button type="button" class="btn small" data-act="addCaught">Add a fish</button>
      <h3>Fish and animals seen</h3>
      <div class="seg" id="seenChips">${SPECIES.map(sp => `<button type="button" data-act="seen" data-v="${esc(sp)}" class="${DS.seen.has(sp) ? 'on' : ''}" aria-pressed="${DS.seen.has(sp)}">${esc(sp)}</button>`).join('')}</div>
      <label>Other species seen<input id="logSeenOther" type="text" maxlength="120" placeholder="comma-separated" value="${esc([...DS.seen].filter(sp => !SPECIES.includes(sp)).join(', '))}"></label>
      <label>Notes<textarea id="logNote" rows="2" maxlength="300" placeholder="kelp, bait, boats, anything worth remembering">${edit && edit.note ? esc(edit.note) : ''}</textarea></label>
      <datalist id="speciesList">${SPECIES.map(sp => `<option value="${esc(sp)}">`).join('')}</datalist>
      <div class="actions flexwrap"><button class="btn primary" data-act="saveLog" data-spot="${esc(spotId)}">Save dive</button><button class="btn" data-act="closeSheet">Cancel</button>${edit ? `<button class="btn" data-act="delLog" data-id="${esc(edit.id)}" style="margin-left:auto">Delete dive</button>` : ''}</div>`);
    checkProtected();
  }
  function fishRow(c) {
    c = c || {};
    return `<div class="fishrow"><input class="fc-sp" list="speciesList" placeholder="Species" value="${esc(c.sp || '')}" aria-label="Species caught"><input class="fc-n" type="number" inputmode="numeric" min="1" max="99" value="${c.n || 1}" aria-label="How many"><input class="fc-lb" type="number" inputmode="decimal" min="0" step="0.1" placeholder="lb" value="${c.lb || ''}" aria-label="Weight in pounds"><button type="button" class="iconbtn" data-act="rmCaught" aria-label="Remove fish">✕</button></div>`;
  }
  function checkProtected() {
    const w = $('#protWarn'); if (!w) return;
    const hit = [...document.querySelectorAll('#caughtRows .fc-sp')].map(i => i.value.trim()).filter(v => PROTECTED.has(v));
    w.hidden = !hit.length;
    w.textContent = hit.length ? `${[...new Set(hit)].join(' and ')} ${hit.length > 1 ? 'are' : 'is'} protected in California: no take. Log ${hit.length > 1 ? 'them' : 'it'} under "seen" instead.` : '';
  }
  function saveLog() {
    const spotId = $('#logSpot').value || null;
    const s = spotId ? S.byId[spotId] : null, r = spotId ? S.results[spotId] : null;
    const visRaw = $('#logVis').value.trim(), obs = visRaw === '' ? null : parseFloat(visRaw);
    if (visRaw !== '' && !(obs >= 0)) { $('#logVis').focus(); return; }
    let when = $('#logTime').value;
    if (when === 'other') {
      const v = $('#logDate').value;
      if (!/^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(v)) { $('#logDate').focus(); return; }
      when = v.slice(0, 16);
    }
    const caught = [...document.querySelectorAll('#caughtRows .fishrow')].map(row => ({
      sp: row.querySelector('.fc-sp').value.trim().slice(0, 60),
      n: Math.max(1, Math.round(parseFloat(row.querySelector('.fc-n').value) || 1)),
      lb: parseFloat(row.querySelector('.fc-lb').value) || null,
    })).filter(c => c.sp).map(c => (c.lb ? c : { sp: c.sp, n: c.n }));
    const other = $('#logSeenOther').value.split(',').map(x => x.trim().slice(0, 60)).filter(Boolean);
    const seen = [...new Set([...[...DS.seen].filter(sp => SPECIES.includes(sp)), ...other])];
    const depth = parseFloat($('#logDepth').value), temp = parseFloat($('#logTempF').value);
    const note = $('#logNote').value.trim().slice(0, 300);
    if (obs == null && !caught.length && !seen.length && !note && !DS.surge && !DS.current && !DS.color && !(depth > 0) && !(temp > 0)) {
      $('#logVis').focus(); return;
    }
    // time: hour key within the forecast window → model prediction for calibration; otherwise LA wall-clock time
    const hourKey = when.slice(0, 13) + ':00';
    const i = r && r.times ? r.times.indexOf(hourKey) : -1;
    const predFt = obs != null && i >= 0 ? r.run.vis[i] : null;
    const nowI = r && r.times ? r.times.indexOf(D.nowHourKey()) : -1;
    const tMs = i >= 0 && nowI >= 0 ? Date.now() - Math.max(0, nowI - i) * 3600000 : laInstant(when.slice(0, 10), +when.slice(11, 13)) + (+when.slice(14, 16) || 0) * 60000;
    const prev = DS.id ? S.logs.find(l => l.id === DS.id) : null;
    const entry = {
      id: DS.id || Math.random().toString(36).slice(2, 10), spotId, group: s ? s.group : null, t: tMs, when,
      predFt: obs != null ? (predFt != null ? predFt : (prev && prev.when === when && prev.spotId === spotId ? prev.predFt : null)) : null, note,
    };
    if (obs != null) entry.obsFt = obs;
    if (DS.lat != null) { entry.lat = DS.lat; entry.lon = DS.lon; }
    if (depth > 0) entry.depthFt = depth;
    if (temp > 0) entry.tempF = temp;
    for (const k of ['surge', 'current', 'color']) if (DS[k]) entry[k] = DS[k];
    if (caught.length) entry.caught = caught;
    if (seen.length) entry.seen = seen;
    S.logs = DS.id ? S.logs.map(l => (l.id === DS.id ? entry : l)) : S.logs.concat([entry]);
    D.lsSet('logs', S.logs);
    nat('success');
    closeSheet(); compute(); render();
  }

  function tuneSheet(spotId) {
    const s = S.byId[spotId], b = S.base.find(x => x.id === spotId);
    const f = (key, label, min, max, step, help) => `<label>${esc(label)} <span class="muted">(default ${b[key]})</span><input id="tune_${key}" type="number" min="${min}" max="${max}" step="${step}" value="${s[key]}"><small class="muted">${esc(help)}</small></label>`;
    openSheet(`<h2>Tune · ${esc(s.name)}</h2>
      ${f('vref', 'Clean-and-calm visibility (ft)', 5, 80, 1, 'What you see on a flat, windless day with clean water.')}
      ${f('depth', 'Typical dive depth (ft)', 5, 120, 1, 'Deeper = less wave surge at the bottom.')}
      ${f('S', 'Loose sand/silt nearby (0–1)', 0, 1, 0.05, '1 = sandy beach, 0.1 = clean pinnacle.')}
      ${f('R', 'Runoff exposure (0–1)', 0, 1, 0.05, '1 = next to a river mouth or storm drain.')}
      <div class="actions"><button class="btn primary" data-act="saveTune" data-spot="${esc(spotId)}">Save</button><button class="btn" data-act="resetTune" data-spot="${esc(spotId)}">Reset to defaults</button></div>`);
  }
  function saveTune(spotId, reset) {
    if (reset) delete S.overrides[spotId];
    else {
      const o = {};
      for (const k of ['vref', 'depth', 'S', 'R']) { const v = parseFloat($('#tune_' + k).value); if (isFinite(v)) o[k] = v; }
      S.overrides[spotId] = o;
    }
    D.lsSet('overrides', S.overrides);
    applyOverrides(); closeSheet(); compute(); render();
  }

  function settingsSheet() {
    const logs = S.logs.slice().sort((a, b) => b.t - a.t);
    const theme = document.documentElement.getAttribute('data-theme') || 'dark';
    const alertsHtml = NATIVE && N.alerts ? `
      <h3>Clear-water alerts</h3>
      <label class="check"><input id="alertsOn" type="checkbox"${S.alerts.on ? ' checked' : ''}> Notify me the evening before</label>
      <label>When a saved spot's morning visibility is at least<select id="alertsFt">${[15, 20, 25, 30].map(v => `<option value="${v}"${S.alerts.ft === v ? ' selected' : ''}>${v} ft</option>`).join('')}</select></label>
      <p class="muted small">Checks your saved spots (★) for the next 3 days and sends at most one alert a day, at 6 PM. Low-confidence days are skipped. Alerts use the forecast from the app's last refresh, so open the app now and then to keep them current.</p>` : '';
    openSheet(`<h2>Settings &amp; dive log</h2>
      <label>Look<select id="themeSel"><option value="dark"${theme === 'dark' ? ' selected' : ''}>Deep water</option><option value="light"${theme === 'light' ? ' selected' : ''}>Light</option><option value="auto"${theme === 'auto' ? ' selected' : ''}>Match phone</option></select></label>
      ${alertsHtml}
      <h3>Your dives</h3>
      <p class="muted">${logs.length ? `${logs.length} dive${logs.length > 1 ? 's' : ''} logged. See and edit them in the Dives tab.` : 'No dives logged yet. Use the Map or a spot\'s page to log one.'}</p>
      <div class="actions flexwrap"><button class="btn" data-act="export">Export backup</button><label class="btn filebtn">Import backup<input id="importFile" type="file" accept="application/json" hidden></label><button class="btn" data-act="clearCache">Clear cached data</button></div>
      <p class="muted small">${NATIVE ? 'Your log, saved spots and tuning live on this iPhone (and in its backups).' : 'Your log, saved spots and tuning live only in this browser.'} Export a backup to move them to another device.</p>`);
  }
  function exportBackup() {
    const json = JSON.stringify({ app: 'spearline-vis', v: 1, logs: S.logs, overrides: S.overrides, favs: [...S.favs] }, null, 1);
    const name = `spearline-vis-backup-${D.todayLocal()}.json`;
    if (NATIVE) {   // download links don't work in an iOS web view: write the file and open the Share sheet
      Promise.resolve().then(() => N.shareFile(name, json)).catch(e => { if (!$('#sheet').hidden) alertInline('Export failed: ' + (e && e.message || e)); });
      return;
    }
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function importBackup(file) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result);
        if (j.app !== 'spearline-vis') throw new Error('not a SpearLine backup');
        const known = new Set(S.logs.map(l => l.id));
        for (const l of (j.logs || [])) if (l && l.id && !known.has(l.id) && (l.spotId || l.lat != null) && (typeof l.obsFt === 'number' || isDive(l))) S.logs.push(l);
        Object.assign(S.overrides, j.overrides || {});
        for (const f of (j.favs || [])) S.favs.add(f);
        D.lsSet('logs', S.logs); D.lsSet('overrides', S.overrides); D.lsSet('favs', [...S.favs]);
        applyOverrides(); compute(); render(); settingsSheet();
      } catch (e) { alertInline('Import failed: ' + e.message); }
    };
    rd.readAsText(file);
  }
  function alertInline(msg) { const p = document.createElement('p'); p.className = 'error'; p.textContent = msg; $('#sheetBody').prepend(p); }

  function aboutSheet() {
    openSheet(`<h2>How the number is made</h2>
      <p>SpearLine Vis estimates how far you'll see underwater from satellite chlorophyll, swell and wind forecasts, and rain runoff, combined with published ocean-optics physics. Every step is shown below. Everything adds up as light attenuation <i>c</i> (per metre), and visibility is <b>4.8 ÷ c</b>, the relation Zaneveld &amp; Pegau (2003) showed holds within ~10% for divers' horizontal visibility of a dark target.</p>
      <ol class="how">
        <li><b>Water itself</b> — 0.047 /m (Pope &amp; Fry 1997, 532 nm).</li>
        <li><b>Plankton</b> — satellite chlorophyll (NASA GIBS: VIIRS NOAA-20/21, backfilled with OLCI, PACE, MODIS) turned into attenuation with the open-ocean relation 0.31·Chl<sup>0.62</sup> (Gordon &amp; Morel 1983). Future days carry today's value forward, drifting toward the 2-week median.</li>
        <li><b>Bottom surge</b> — each swell and wind-wave component from Open-Meteo is reduced by the spot's exposure in its direction (ray-cast from a 250 m land mask), then linear wave theory gives the near-bed velocity at the dive depth. Sand starts moving near 0.20 m/s; the excess stress stirs up sediment, which settles over ~12 h.</li>
        <li><b>Wind chop</b> — onshore wind above ~6 kt.</li>
        <li><b>Runoff</b> — rain above 0.1 in feeds a 72 h decaying index (LA County's 72 h rule; plumes persist for days per Nezlin &amp; DiGiacomo 2005), scaled by how plume-prone the spot is.</li>
        <li><b>Spot baseline</b> — what the spot shows on a clean, flat day. These start as estimates; your dive log corrects each spot and its area.</li>
      </ol>
      <p>Divers judge lower-contrast targets than a black disk, so the result is scaled by 0.6. Confidence drops with older satellite data, longer lead times, big swell and rain.</p>
      <p class="muted small">Sources: Zaneveld &amp; Pegau, Optics Express 11:2997 (2003) · Pope &amp; Fry, Applied Optics 36:8710 (1997) · Morel, JGR 114 (2009) review of Gordon &amp; Morel (1983) · Nezlin &amp; DiGiacomo, Remote Sensing of Environment 98:494 (2005) · LA County Public Health rain advisory · Open-Meteo (MFWAM waves, weather models) · NASA GIBS · NOAA CO-OPS tides. Estimates only — dive at your own risk.</p>
      <h3>Data and credits</h3>
      <ul class="credits">
        <li>${extLink('https://open-meteo.com/', 'Weather data by Open-Meteo.com')}: waves, wind and rain, licensed under ${extLink('https://creativecommons.org/licenses/by/4.0/', 'CC BY 4.0')}. SpearLine Vis modifies this data by turning it into visibility estimates. Wave models from Météo-France, ECMWF, DWD, NOAA NCEP and the Copernicus Marine Service; weather models from the national weather services listed on ${extLink('https://open-meteo.com/en/licence', 'Open-Meteo’s licence page')}.</li>
        <li>We acknowledge the use of imagery provided by services from NASA's Global Imagery Browse Services (GIBS), part of NASA's Earth Science Data and Information System (ESDIS). Satellite chlorophyll from VIIRS (NOAA-20, NOAA-21), MODIS Aqua and PACE OCI.</li>
        <li>Contains modified Copernicus Sentinel data ${esc(D.todayLocal().slice(0, 4))} (Sentinel-3 OLCI chlorophyll).</li>
        <li>Tide predictions from ${extLink('https://tidesandcurrents.noaa.gov/', 'NOAA CO-OPS')} (Center for Operational Oceanographic Products and Services).</li>
        <li>Map data © ${extLink('https://www.openstreetmap.org/copyright', 'OpenStreetMap contributors')}, available under the Open Database License; map tiles from the OpenStreetMap Foundation. Optional nautical chart layer from ${extLink('https://nauticalcharts.noaa.gov/', 'NOAA Office of Coast Survey')}. Reef, rock, kelp, wreck and jetty symbols on the Ventura coast come from NOAA Electronic Navigational Charts (public domain), built into the app; positions are approximate. The map is for planning only, not for navigation.</li>
      </ul>
      <p class="muted small">None of these providers endorses SpearLine Vis.</p>
      ${LINKS.privacy || LINKS.support ? `<p class="small">${[LINKS.privacy && extLink(LINKS.privacy, 'Privacy policy'), LINKS.support && extLink(LINKS.support, 'Support')].filter(Boolean).join(' · ')}</p>` : ''}
      ${NATIVE && N.appVersion ? `<p class="muted small">SpearLine Vis ${esc(N.appVersion)}</p>` : ''}`);
  }
  // External links: a normal new-tab link on the web; on iOS they open in an in-app Safari sheet (see the click handler).
  function extLink(href, text) { return `<a href="${esc(href)}" target="_blank" rel="noopener" data-ext>${esc(text)}</a>`; }

  // ── Events ────────────────────────────────────────────────────────────────────
  document.addEventListener('click', ev => {
    const ext = ev.target.closest('a[data-ext]');
    if (ext) { if (NATIVE) { ev.preventDefault(); nat('openUrl', ext.href); } return; }
    const t = ev.target.closest('[data-group],[data-day],[data-spot],[data-act],[data-view],[data-map],[data-dive]');
    if (!t) return;
    if (t.dataset.view) { nat('tap'); setView(t.dataset.view); return; }
    if (t.dataset.map) { mapAction(t.dataset.map, t); return; }
    if (t.dataset.dive && !t.dataset.act) { diveSheet({ id: t.dataset.dive }); return; }
    if (t.dataset.group) {
      nat('tap'); S.group = t.dataset.group; D.lsSet('group', S.group); renderTabs();
      if (S.view === 'map') fitSpots(S.group === '★ Saved' ? S.spots.filter(s => S.favs.has(s.id)) : S.spots.filter(s => s.group === S.group));
      else { renderView(); window.scrollTo({ top: 0 }); }
      return;
    }
    if (t.dataset.day != null && !t.dataset.act) { nat('tap'); S.selDay = +t.dataset.day; renderDays(); renderView(); if (S.openSpot) renderDetail(); return; }
    const act = t.dataset.act;
    if (!act && t.dataset.spot) { openDetail(t.dataset.spot); return; }
    switch (act) {
      case 'reload': load(true); break;
      case 'close': history.length > 1 && history.state && history.state.spot ? history.back() : closeDetail(); break;
      case 'fav': { const id = S.openSpot; if (S.favs.has(id)) S.favs.delete(id); else S.favs.add(id); D.lsSet('favs', [...S.favs]); renderTabs(); renderView(); renderDetail(); break; }
      case 'log': diveSheet({ spotId: S.openSpot }); break;
      case 'saveLog': saveLog(); break;
      case 'newDive': setView('map'); mapAction('place'); break;
      case 'clearFilter': S.diveFilter = ''; renderView(); break;
      case 'seg': { const k = t.dataset.k, v = t.dataset.v; DS[k] = DS[k] === v ? '' : v; t.parentNode.querySelectorAll('button').forEach(b => { const on = b.dataset.v === DS[k]; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }); break; }
      case 'seen': { const v = t.dataset.v; if (DS.seen.has(v)) DS.seen.delete(v); else DS.seen.add(v); const on = DS.seen.has(v); t.classList.toggle('on', on); t.setAttribute('aria-pressed', String(on)); break; }
      case 'addCaught': { $('#caughtRows').insertAdjacentHTML('beforeend', fishRow()); const rows = document.querySelectorAll('#caughtRows .fc-sp'); rows[rows.length - 1].focus(); break; }
      case 'rmCaught': t.closest('.fishrow').remove(); checkProtected(); break;
      case 'tune': tuneSheet(S.openSpot); break;
      case 'saveTune': saveTune(t.dataset.spot, false); break;
      case 'resetTune': saveTune(t.dataset.spot, true); break;
      case 'settings': settingsSheet(); break;
      case 'about': aboutSheet(); break;
      case 'closeSheet': closeSheet(); break;
      case 'sort': nat('tap'); S.sort = S.sort === 'area' ? 'vis' : 'area'; D.lsSet('sort', S.sort); renderDays(); renderView(); break;
      case 'delLog': S.logs = S.logs.filter(l => l.id !== t.dataset.id); D.lsSet('logs', S.logs); closeSheet(); compute(); render(); break;
      case 'export': exportBackup(); break;
      case 'clearCache': try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && /^spearline:(chl:|chlLut|tide:|snapshot)/.test(k)) localStorage.removeItem(k); } } catch (e) { /* ignore */ } closeSheet(); load(true); break;
    }
  });
  document.addEventListener('change', ev => {
    if (ev.target.id === 'themeSel') { const v = ev.target.value; document.documentElement.setAttribute('data-theme', v); D.lsSet('theme', v); syncStatusBar(); }
    if (ev.target.id === 'logTime') $('#logDateWrap').hidden = ev.target.value !== 'other';
    if (ev.target.id === 'diveSpecies') { S.diveFilter = ev.target.value; renderDives(); }
    if (ev.target.id === 'diveArea') { S.diveArea = ev.target.value; renderDives(); }
    if (ev.target.id === 'alertsOn') setAlertsOn(ev.target.checked);
    if (ev.target.id === 'alertsFt') { S.alerts.ft = +ev.target.value; D.lsSet('alerts', S.alerts); scheduleAlerts(); }
    if (ev.target.id === 'importFile' && ev.target.files[0]) importBackup(ev.target.files[0]);
  });
  document.addEventListener('input', ev => { if (ev.target.classList && ev.target.classList.contains('fc-sp')) checkProtected(); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (S.openSpot) closeDetail(); } });
  $('#sheet').addEventListener('click', ev => { if (ev.target.id === 'sheet') closeSheet(); });
  window.addEventListener('popstate', () => { if (S.openSpot) closeDetail(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.raw && Date.now() - S.raw.t > 3 * 3600000) load(true); });

  // ── Native-only glue (no-ops in a browser) ────────────────────────────────────
  // Status bar text colour follows the effective theme: manual choice, else the phone's appearance.
  function syncStatusBar() {
    if (!NATIVE) return;
    const t = document.documentElement.getAttribute('data-theme');
    const dark = t !== 'light' && (t !== 'auto' || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
    nat('setStatusBarDark', dark);
  }
  if (NATIVE) {
    try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncStatusBar); } catch (e) { /* ignore */ }
    nat('onResume', () => { if (S.raw && Date.now() - S.raw.t > 3 * 3600000) load(true); });   // same staleness rule as visibilitychange
  }

  // ── Boot ──────────────────────────────────────────────────────────────────────
  // Deep water is the default look; "auto" follows the phone, "light" forces light.
  const theme = D.lsGet('theme', 'dark');
  document.documentElement.setAttribute('data-theme', ['dark', 'light', 'auto'].includes(theme) ? theme : 'dark');
  syncStatusBar();
  applyOverrides();
  const snap = D.lsGet('snapshot:v1', null);
  if (snap && snap.marine && snap.weather) { S.raw = snap; S.offline = true; try { compute(); } catch (e) { S.raw = null; } }
  render();
  load(false);
  window.__spearline = S;   // handy for debugging in the console
  }

  if (NATIVE) Promise.resolve(N.ready).then(start, start); else start();
})();

</script>
